ackpack-guide h2{font-size:16px;color:#4e7088;margin-bottom:15px}.backpack-guide ol{padding-right:20px;color:#7a92a6;font-size:12px;line-height:2.4}.backpack-note{border:1px solid #ead4df;background:#f9edf2;color:#9e7890;border-radius:13px;padding:17px 20px;font-size:12px;line-height:2;margin-top:20px}.backpack-guide p{font-size:12px;line-height:2;color:#8497a6}.backpack-check{display:flex;align-items:flex-start;gap:10px;font-size:12px;color:#7e96a9;line-height:2;margin-top:10px}.backpack-check input{width:17px;height:17px;margin-top:5px;accent-color:#668eb0}.backpack-ready{font-size:11px;color:#8298aa;margin-top:12px;min-height:22px}.backpack-section-label{font-size:18px;color:#3f647e;margin-top:25px}@media(max-width:1050px){.backpack-grid{grid-template-columns:1fr 1fr}.backpack-hero{grid-template-columns:1fr 150px}.backpack-art{width:150px}.backpack-guide{grid-template-columns:1fr}}@media(max-width:650px){.backpack-hero{grid-template-columns:1fr;padding:25px}.backpack-art{display:none}.backpack-hero h1{font-size:25px}.backpack-download{flex-direction:column;align-items:stretch;padding:22px}.backpack-download-link{width:100%}.backpack-grid{grid-template-columns:1fr}}

<script>
function setupCrisisBackpack(){const nav=document.createElement('button');nav.dataset.view='crisis-backpack';nav.innerHTML='<span>▣</span>کوله‌پشتی بحران';nav.onclick=()=>navigate('crisis-backpack');document.querySelector('nav').append(nav);const section=document.createElement('section');section.id='crisis-backpack';section.className='view';const items=[["✓", "چک‌لیست ادامهٔ آموزش", "آماده‌سازی، کار در زمان قطعی و بازگشت به برنامه."], ["▤", "فرم ارائهٔ ساختاریافتهٔ SBAR", "تمرین بیان منظم، کوتاه و روشنِ یک کیس فرضی."], ["◇", "کاربرگ استدلال بالینی", "فکرکردن را ثبت کن؛ فقط جواب نهایی را ننویس."], ["◷", "دفتر جلسهٔ منتورینگ", "آمادگی، بازخورد و گام بعدی را در یک جا نگه دار."], ["✎", "دفتر یادگیری و پرسش‌ها", "آنچه می‌دانی، آنچه مبهم است و آنچه باید پیگیری شود."], ["▦", "برنامهٔ هفت‌روزهٔ آفلاین", "یک مسیر سبک و قابل تنظیم برای حفظ پیوستگی یادگیری."], ["♡", "بیمار مجازی آفلاین", "سناریوی تعاملی تنفسی؛ تغییر مسیر با انتخاب‌های شما."], ["▣", "سه ایستگاه تمرینی با راهنمای پاسخ", "داخلی، جراحی و کودکان؛ سناریوهای کاملاً ساختگی برای تمرین آموزشی."], ["✦", "راهنمای بازخورد و جمع‌بندی", "مثال‌های روشن، چک‌لیست آموزشی و فرم گام بعدی."], ["⌕", "کاربرگ خواندن نقادانهٔ منابع", "اعتبار، کاربرد، محدودیت و تفکیک منبع از برداشت شخصی."], ["▦", "ادامهٔ برنامه تا ۱۴ روز", "تمرین مجدد، نقش‌آفرینی و اصلاح خروجی‌های هفتهٔ اول."], ["↻", "راهنمای بازگشت پس از اتصال", "مرتب‌سازی خروجی‌ها، پیام به منتور و پیش‌نویس فروم."], ["☷", "منابع و حدود استفاده", "منابع رسمی، تاریخ نسخه و روش پیگیری پس از اتصال."]];section.innerHTML=`<div class="backpack-hero"><div><span class="tag">قبل از قطعی، همراهت باشد</span><h1>کوله‌پشتی بحران</h1><p>یادگیری را همراه خودت نگه دار؛ یک بستهٔ سبک و فارسی برای وقتی اینترنت در دسترس نیست.</p></div><svg class="backpack-art" viewBox="0 0 200 220" aria-hidden="true"><circle cx="100" cy="110" r="88" fill="#d6eafa08" stroke="#c9dfef22"/><path d="M71 52V39Q71 22 88 22H112Q129 22 129 39V52" fill="none" stroke="#dfb2cb" stroke-width="10"/><rect x="43" y="47" width="114" height="149" rx="31" fill="#e2edf7"/><rect x="48" y="91" width="104" height="96" rx="24" fill="#b7d2e8"/><path d="M54 62L40 83V166M146 62L160 83V166" stroke="#8fafca" stroke-width="9" fill="none"/><rect x="63" y="112" width="74" height="61" rx="17" fill="#e5b9ce"/><path d="M90 128H110M100 118V138" stroke="#fff4f8" stroke-width="6" stroke-linecap="round"/><path d="M69 157H131" stroke="#b2829d" stroke-width="3"/><circle cx="146" cy="45" r="16" fill="#fbf1df"/><path d="M140 45L144 49L152 40" stroke="#9c8a70" stroke-width="3" fill="none"/></svg></div><div class="backpack-download"><div><h2>بستهٔ کامل آفلاین را دریافت کن.</h2><p>۱۳ بخش آموزشی با مثال تکمیل‌شده، راهنمای پاسخ، برنامهٔ ۱۴روزه و نسخهٔ یک‌جای قابل چاپ؛ همراه با فرم‌ها و بیمار مجازی آفلاین.</p><div class="backpack-details"><span>ZIP · حدود ۱۴۲ کیلوبایت</span><span>نسخهٔ ۲ · ۹ آبان ۱۴۰۵</span><span>بدون نیاز به ورود، پس از دانلود</span></div></div><a id="crisisBackpackDownload" class="backpack-download-link" href="/downloads/clinical-bridge-crisis-backpack-v2.zip" download="کوله-پشتی-بحران.zip"><span aria-hidden="true">↓</span>دانلود کوله‌پشتی بحران</a></div><h2 class="backpack-section-label">داخل کوله‌پشتی چه داریم؟</h2><div class="backpack-grid">${items.map(([icon,title,desc])=>'<article class="backpack-item"><b aria-hidden="true">'+icon+'</b><h3>'+title+'</h3><p>'+desc+'</p></article>').join('')}</div><div class="backpack-guide"><div class="panel"><h2>سه قدم تا استفادهٔ آفلاین</h2><ol><li>در زمان اتصال، دکمهٔ دانلود بالا را بزن.</li><li>فایل ZIP را کامل استخراج کن.</li><li>فایل <b dir="ltr">index.html</b> را داخل پوشه با مرورگر باز کن.</li></ol><p>فرم‌ها امکان دریافت پاسخ‌ها به‌صورت JSON و چاپ / ذخیرهٔ PDF دارند. برای انتقال فایل به گوشی، کل پوشه را همراه دارایی‌هایش نگه دار.</p></div><div class="panel"><h2>قبل از قطعی یک بار آزمایش کن.</h2><label class="backpack-check"><input type="checkbox" class="backpack-readiness">فایل ZIP را در پوشهٔ دانلودهای دستگاه پیدا کردم.</label><label class="backpack-check"><input type="checkbox" class="backpack-readiness">بعد از استخراج، index.html را باز کردم.</label><label class="backpack-check"><input type="checkbox" class="backpack-readiness">در حالت قطع اینترنت، یکی از فرم‌ها را امتحان کردم.</label><p id="backpackReadinessStatus" class="backpack-ready" role="status">این چک‌لیست فقط برای بررسی شما در همین صفحه است.</p></div></div><div class="backpack-note">فقط محتوای داخل بسته بدون اینترنت کار می‌کند؛ تماس آنلاین و فروم به اتصال نیاز دارند. پاسخ‌ها و نتایج بسته خودکار به سایت یا منتور ارسال نمی‌شوند؛ از آن‌ها خروجی بگیر. سناریوی بیمار مجازی کاملاً آموزشی و فرضی است.</div>`;document.querySelector('footer').before(section);section.querySelectorAll('.backpack-readiness').forEach(input=>input.onchange=()=>{const count=section.querySelectorAll('.backpack-readiness:checked').length;$('#backpackReadinessStatus').textContent=count===3?'آماده‌ای؛ یک نسخهٔ پشتیبان هم نگه دار.':count.toLocaleString('fa-IR')+' از ۳ مرحله بررسی شده است.'})}
</script>
