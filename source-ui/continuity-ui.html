<style>

ard input[type=range]{accent-color:#c68da7;display:block;width:100%}.ct-card button,.ct-toolbar button{font-size:12px;padding:10px 15px;border-radius:10px}.ct-card button:disabled{opacity:.5}.ct-muted{font-size:11px!important;color:#8799a5!important}.ct-notice{padding:13px 16px;border-radius:12px;background:#e9f1f8;color:#5e7e94;font-size:11px;line-height:2;margin:12px 0}.ct-notice.rose{background:#f9e9ef;color:#966d83}.ct-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ct-pill{font-size:10px;border-radius:8px;padding:5px 9px;background:#e6f0f6;color:#5f8196;white-space:nowrap}.ct-pill.urgent{background:#f6dfe8;color:#a75f80}.ct-meta{font-size:10px;color:#8a9ea9;margin:7px 0}.ct-reply{border-right:3px solid #d6a6bc;background:#faf1f3;padding:11px 14px;margin:10px 0;border-radius:8px}.ct-reply p{margin:0}.ct-four{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ct-four label{margin:0}.ct-sbar-letter{width:25px;height:25px;display:inline-grid;place-items:center;border-radius:8px;background:#e0edf6;color:#456d84;font-size:12px;margin-inline-end:6px}.ct-chat{max-height:500px;overflow:auto;padding:8px;background:#f0f4f7;border-radius:15px;display:flex;flex-direction:column-reverse;gap:10px}.ct-bubble{background:#fffdf7;border:1px solid #e0e6e9;border-radius:15px;padding:14px;max-width:85%;align-self:flex-end;min-width:120px}.ct-bubble.mine{background:#e0edf6;align-self:flex-start}.ct-bubble p{margin:4px 0;color:#486a80}.ct-empty{padding:25px;text-align:center;font-size:12px;line-height:2.2;color:#8299a7}.ct-table{width:100%;border-collapse:collapse;min-width:570px;font-size:12px}.ct-table td,.ct-table th{padding:12px;text-align:right;border-bottom:1px solid #e1e7eb;color:#6c879a}.ct-table th{background:#e9f1f6}.ct-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.ct-metric{padding:19px 14px;border-radius:15px;background:#e6f0f7;color:#5a8097;font-size:11px;line-height:2}.ct-metric b{display:block;font-size:27px;color:#315b72}.ct-metric:nth-child(2){background:#f7e6ed}.ct-metric:nth-child(3){background:#f8efde}.ct-library a{font-size:11px;color:#658da8;text-underline-offset:4px}.ct-library button{margin-top:12px}.ct-library ul{padding-inline-start:18px}.ct-pulse-trend{display:flex;align-items:end;gap:9px;height:140px;padding-top:20px;margin:18px 0}.ct-pulse-bar{flex:1;min-width:10px;background:linear-gradient(#d6a2bc,#c3dced);border-radius:8px 8px 3px 3px;position:relative}.ct-pulse-bar span{position:absolute;top:-24px;font-size:10px;width:100%;text-align:center;color:#7890a2}.ct-pulse-bar small{position:absolute;bottom:4px;width:100%;text-align:center;font-size:9px;color:#395e76}.ct-breath{width:116px;height:116px;margin:20px auto;background:#e1edf7;box-shadow:0 0 0 15px #f7e9ef;border-radius:50%;display:grid;place-items:center;color:#64879f;font-size:16px;transition:transform 4s ease}.ct-breath.expand{transform:scale(1.16)}.ct-queue{font-size:11px;color:#7b8e9c;background:#f7efdf;border-radius:12px;padding:12px 16px;line-height:2}.ct-file{font-size:11px}.ct-tagline{color:#edc4d5;font-size:11px;letter-spacing:.5px}.ct-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.ct-card :focus-visible,.ct-tabs :focus-visible{outline:3px solid #d79fbc;outline-offset:3px}@media(max-width:850px){.ct-grid{grid-template-columns:1fr}.ct-hero{padding:22px}.ct-hero h1{font-size:23px}.ct-hero-art{width:62px;height:62px;font-size:33px}.ct-four{grid-template-columns:1fr}.ct-tabs button{padding:10px}.ct-metrics{gap:6px}.ct-metric{padding:13px 8px}.ct-metric b{font-size:22px}}@media(prefers-reduced-motion:reduce){.ct-breath{transition:none}}
</style>
<script>
let ctTab='sbar',ctRows=[],ctOffset=0,ctMore=false,ctStudent='',ctRoster=[],ctBusy=false,ctEpoch=0,ctReport=null,ctSeen=null,ctBreath=null;
const ctSkillNames={handover:'تحویل ساختاریافته',assessment:'ارزیابی و گزارش مشاهدات',teamwork:'ارتباط و کار تیمی',resources:'تصمیم آموزشی در کمبود منابع'};
const ctSkillSteps={handover:['معرفی نقش و خلاصهٔ وضعیت','تفکیک پیشینه از یافتهٔ فعلی','بیان عدم قطعیت و درخواست روشن','بازگویی و تأیید برداشت مشترک'],assessment:['مرور چارچوب با ناظر حاضر','ثبت داده و زمان مشاهده','تفکیک مشاهده از استنباط','مرور محدودیت‌ها و نیاز به کمک'],teamwork:['تعیین مسئول و نقش‌ها','گزارش کوتاه و روشن','گوش دادن و بازگویی درخواست','مرور بازخورد تیم'],resources:['فهرست محدودیت منابع','مرور گزینه‌ها با ناظر','بیان ریسک و اطلاعات نامعلوم','ثبت برنامهٔ پیگیری آموزشی']};
const ctLevels=['','مشاهده‌گر','نظارت مستقیم','نظارت غیرمستقیم','سطح بالاترِ ثبت‌شده؛ تابع صلاحیت محل'];
const ctPulseQuestions=['امروز توانستم روی یادگیری تمرکز کنم.','احساس می‌کنم از پس فشار فعلی برمی‌آیم.','از همتایان یا منتور حمایت دریافت می‌کنم.','خواب و استراحت کافی داشته‌ام.','به توانایی خود برای کمک گرفتن اعتماد دارم.'];
function ctNum(n){return Number(n).toLocaleString('fa-IR',{maximumFractionDigits:1})}
function ctDate(d){return new Date(d).toLocaleString('fa-IR',{timeZone:'Asia/Tehran',dateStyle:'short',timeStyle:'short'})}
function ctKey(){return 'bridge-continuity-outbox-v1-'+serverUser.id}
function ctOut(){try{const x=JSON.parse(localStorage.getItem(ctKey())||'[]');const rows=Array.isArray(x)?x.filter(r=>r.owner===serverUser.id&&r.created>Date.now()-7*86400000&&r.created<=Date.now()+60000).slice(0,20):[];if(JSON.stringify(x)!==JSON.stringify(rows))localStorage.setItem(ctKey(),JSON.stringify(rows));return rows}catch{return []}}
function ctStore(rows){localStorage.setItem(ctKey(),JSON.stringify(rows));ctQueueStatus()}
function ctQueueStatus(){const el=$('#ctQueue');if(!el)return;const n=ctOut().length;el.innerHTML='<b>'+ctNum(n)+' ثبت در صف این دستگاه</b> · '+(navigator.onLine?'اتصال شبکه برقرار است؛ ارسال فقط پس از تأیید حساب انجام می‌شود.':'شبکه قطع است؛ پیش از بستن صفحه وضعیت ذخیره را بررسی کن.')+'<div class="ct-actions"><button class="secondary" onclick="ctSync()">ارسال صف</button><button class="secondary" onclick="ctExportQueue()">پشتیبان صف</button><button class="secondary" onclick="ctClearQueue()">پاک کردن صف</button></div>'}
function setupContinuity(){const nav=document.createElement('button');nav.dataset.view='continuity';nav.innerHTML='<span>✚</span> همراهی و تداوم آموزش';nav.onclick=()=>navigate('continuity');document.querySelector('nav').append(nav);const section=document.createElement('section');section.id='continuity';section.className='view';section.innerHTML='<div class="ct-hero"><div><span class="ct-tagline">از گزارش تا بازخورد؛ همراه هم</span><h1>همراهی در شرایط دشوار</h1><p>گزارش آموزشی، مهارت‌ها، گفت‌وگو و حمایت؛ یک مسیر پیوسته بین منتی و منتورِ خودش.</p></div><div class="ct-hero-art" aria-hidden="true">✚</div></div><div class="ct-tabs" id="ctTabs" role="tablist" aria-label="بخش‌های همراهی"></div><div class="ct-toolbar" id="ctToolbar"></div><p id="ctStatus" class="ct-status" role="status" aria-live="polite"></p><div id="ctContent"></div><details class="ct-card"><summary>اینترنت ضعیف و نگهداری روی دستگاه</summary><p class="ct-muted">ذخیرهٔ صف اختیاری است و تنها برای دستگاه شخصی توصیه می‌شود. نام، شماره تماس، پرونده یا اطلاعات شناسایی بیمار را وارد نکن. صف به حساب فعلی وابسته است و پس از ۷ روز پاک می‌شود؛ ارسال تکراری رکورد جدید نمی‌سازد. پیام در صف هنوز به منتور نرسیده است.</p><label><input type="checkbox" id="ctOfflineConsent"> این دستگاه شخصی است؛ در قطع اتصال ثبت‌ها را در صف نگه دار.</label><div class="ct-queue" id="ctQueue"></div><label>بازیابی پشتیبان صف<input type="file" accept="application/json,.json" onchange="ctImportQueue(this)"></label><div class="ct-actions"><a class="secondary" href="/continuity-offline/" target="_blank" rel="noopener">تمرین آفلاین و کتابخانه ←</a><button class="secondary" onclick="navigate(\'crisis-backpack\')">کوله‌پشتی بحران</button></div></details>';document.querySelector('footer').before(section);ctQueueStatus();window.addEventListener('online',ctSync);window.addEventListener('offline',ctQueueStatus);ctRenderTabs()}
function ctRenderTabs(){const student=serverUser.role==='student';const tabs=[['sbar',student?'گزارش SBAR':'صندوق گزارش‌ها'],['skill','دفتر مهارت'],...(serverUser.role!=='admin'?[['message','گفت‌وگوی خصوصی']]:[]),['board','تابلوی گروه'],...(student?[['pulse','حال من']]:[['report','آمار همراهی']]),['library','دستیار منابع']];$('#ctTabs').innerHTML=tabs.map(([id,title])=>'<button role="tab" aria-selected="'+(ctTab===id)+'" onclick="ctOpen(\''+id+'\')">'+title+'</button>').join('')}
async function ctOpen(tab=ctTab){if(ctBusy)return;ctTab=tab;ctOffset=0;ctRows=[];ctMore=false;ctRenderTabs();ctStopBreath();const e=++ctEpoch;$('#ctStatus').textContent='در حال دریافت…';try{if(!ctRoster.length){const r=await api('members');ctRoster=r.members||[]}if(e!==ctEpoch)return;ctRenderToolbar();if(tab==='library'){ctRenderLibrary();$('#ctStatus').textContent='جست‌وجوی محلی؛ پرسش‌ها برای سرویس مدل زبانی ارسال نمی‌شوند.';return}if(tab==='report'){ctReport=await api('continuity/report');if(e!==ctEpoch)return;ctRenderReport();$('#ctStatus').textContent='بر اساس ثبت‌های سرور؛ نبض شخصی در این گزارش نیست.';return}await ctLoad(false,e)}catch(err){if(e===ctEpoch)$('#ctStatus').textContent='دریافت انجام نشد: '+err.message}}
function ctRenderToolbar(){const students=ctRoster.filter(m=>m.role==='student');if(serverUser.role!=='student'&&['sbar','skill','message'].includes(ctTab)){if(ctTab==='message'&&!students.some(s=>s.id===ctStudent))ctStudent=students[0]?.id||'';$('#ctToolbar').innerHTML='<label for="ctStudent">منتی</label><select id="ctStudent" style="width:auto;max-width:260px">'+(ctTab==='message'?'':'<option value="">همهٔ منتی‌های مجاز</option>')+students.map(s=>'<option value="'+escape(s.id)+'" '+(ctStudent===s.id?'selected':'')+'>'+escape(s.name)+'</option>').join('')+'</select><button class="secondary" onclick="ctOpen()">تازه‌سازی</button>';$('#ctStudent').onchange=e=>{ctStudent=e.target.value;ctOpen()}}else{$('#ctToolbar').innerHTML='<button class="secondary" onclick="ctOpen()">تازه‌سازی</button>';if(ctTab!=='message')ctStudent=''}}
async function ctLoad(append=false,epoch=ctEpoch){const sid=serverUser.role==='student'?serverUser.id:ctStudent;if(ctTab==='message'&&!sid){$('#ctContent').innerHTML='<div class="ct-empty">هنوز منتی‌ای به این منتور متصل نیست.</div>';$('#ctStatus').textContent='';return}const tab=ctTab,offset=append?ctOffset+30:0;const r=await api('continuity/entries?kind='+tab+'&offset='+offset+((sid&&['sbar','skill','message'].includes(tab))?'&studentId='+encodeURIComponent(sid):''));if(epoch!==ctEpoch)return;ctRows=append?ctRows.concat(r.entries):r.entries;ctOffset=offset;ctMore=r.more;if(tab==='message'){const read=await api('continuity/reads?studentId='+encodeURIComponent(sid));if(epoch!==ctEpoch)return;ctSeen=read.seenAt;if(document.visibilityState==='visible'&&$('#continuity').classList.contains('active')&&ctTab==='message')await api('continuity/reads','POST',{studentId:sid})}if(epoch!==ctEpoch)return;ctRender();$('#ctStatus').textContent='به‌روز شد · '+ctNum(ctRows.length)+' ثبت'+(ctMore?'؛ موارد قدیمی‌تر در صفحهٔ بعد':'');if(tab==='report')return;if(serverUser.role==='mentor'&&tab==='sbar')ctLoadSupport(epoch)}
function ctRender(){if(ctTab==='sbar')ctRenderSbar();if(ctTab==='skill')ctRenderSkills();if(ctTab==='pulse')ctRenderPulse();if(ctTab==='message')ctRenderChat();if(ctTab==='board')ctRenderBoard();if(ctMore)$('#ctContent').insertAdjacentHTML('beforeend','<button class="secondary" onclick="ctLoadMore()">موارد قدیمی‌تر</button>')}
async function ctLoadMore(){if(ctBusy)return;try{await ctLoad(true)}catch(e){$('#ctStatus').textContent=e.message}}
function ctEmpty(s){return '<div class="ct-empty">'+s+'</div>'}
function ctReplyList(row){return row.replies.map(r=>'<div class="ct-reply"><div class="ct-meta">'+escape(r.owner_name)+' · '+ctDate(r.created)+(r.level?' · '+escape(ctLevels[r.level]):'')+'</div><p>'+escape(r.body)+'</p></div>').join('')+(row.replies.length===50?'<p class="ct-muted">نمایش ۵۰ بازخورد نخست.</p>':'')}
function ctReplyForm(row,skill=false){if(serverUser.role==='admin')return '<p class="ct-muted">برای بازخورد، نمای منتور یا منتی را انتخاب کن.</p>';return '<form onsubmit="ctReply(event,\''+row.id+'\')">'+(skill&&serverUser.role==='mentor'?'<label>سطح مشاهده‌شده<select name="level">'+[1,2,3,4].map(n=>'<option value="'+n+'">'+escape(ctLevels[n])+'</option>').join('')+'</select></label>':'')+'<label>بازخورد / پاسخ<textarea name="text" maxlength="2000" required placeholder="نکتهٔ قوت، نکتهٔ قابل اصلاح و گام بعدی"></textarea></label><button>ارسال بازخورد</button></form>'}
function ctRenderSbar(){const form=serverUser.role==='student'?'<article class="ct-card"><h2>یک گزارش روشن، یک درخواست مشخص</h2><p>فقط سناریوی فرضی یا گزارش کاملاً بدون اطلاعات هویتی؛ اطلاعات بیمار واقعی را در این فضا ثبت نکن.</p><label>وارد کردن پیش‌نویس تمرین آفلاین<input type="file" accept="application/json,.json" onchange="ctImportPractice(this)"></label><form id="ctSbarForm" onsubmit="ctSubmitSbar(event)"><label>عنوان<input name="title" minlength="2" maxlength="140" required></label>'+[['s','S','وضعیت فعلی؛ مشکل چیست؟'],['b','B','پیشینهٔ مرتبط و داده‌های موجود'],['a','A','برداشت من و آنچه هنوز نمی‌دانم'],['r','R','درخواست مشخص و زمان مورد نیاز']].map(([name,l,label])=>'<label><span class="ct-sbar-letter">'+l+'</span>'+label+'<textarea name="'+name+'" minlength="5" maxlength="2000" required></textarea></label>').join('')+'<label><input type="checkbox" name="urgent"> برای مرور آموزشی اولویت بالاتر دارد.</label><label><input type="checkbox" name="deidentified" required> حذف اطلاعات هویتی را بررسی کردم.</label><div class="ct-actions"><button type="button" class="secondary" onclick="ctCheckSbar()">مرور ساختار</button><button>ثبت برای منتور خودم</button></div><p class="ct-muted" id="ctSbarCheck" role="status"></p></form></article>':'';const sorted=[...ctRows].sort((a,b)=>Number(b.data.urgent&&!b.replies.some(r=>r.owner_id===b.mentor_id))-Number(a.data.urgent&&!a.replies.some(r=>r.owner_id===a.mentor_id))||a.created.localeCompare(b.created));const list=sorted.map(row=>{const replied=row.replies.some(r=>r.owner_id===row.mentor_id),age=(Date.now()-Date.parse(row.created))/3600000;return '<article class="ct-card"><div class="ct-row"><h3>'+escape(row.data.title)+'</h3><span class="ct-pill '+(row.data.urgent?'urgent':'')+'">'+(replied?'پاسخ منتور ثبت شد':age>=24?'بیش از ۲۴ ساعت بدون پاسخ':'منتظر مرور منتور')+'</span></div><div class="ct-meta">'+escape(row.owner_name)+' · '+ctDate(row.created)+'</div>'+[['s','وضعیت'],['b','پیشینه'],['a','برداشت'],['r','درخواست']].map(([key,label])=>'<p><b>'+label+' · </b>'+escape(row.data[key])+'</p>').join('')+ctReplyList(row)+ctReplyForm(row)+'</article>'}).join('');$('#ctContent').innerHTML='<div class="ct-notice rose">این صندوق کانال اورژانس نیست و پاسخ ۲۴ ساعته تضمین نمی‌شود. برای وضعیت فوری از مسئول حضوری و مسیر فوریت محل کمک بگیر؛ منتظر پیام آنلاین نمان.</div><div id="ctSupport"></div><div class="ct-grid">'+(form?form+'<div>':'<div style="grid-column:1/-1">')+(list||ctEmpty('هنوز گزارش آموزشی ثبت نشده است.'))+'</div></div>'}
function ctCheckSbar(){const f=$('#ctSbarForm'),values=['s','b','a','r'].map(k=>f.elements[k].value.trim());const missing=values.map((v,i)=>v.length<5?['وضعیت','پیشینه','برداشت','درخواست'][i]:null).filter(Boolean);$('#ctSbarCheck').textContent=missing.length?'بخش‌های کوتاه یا خالی: '+missing.join('، '):'چهار بخش متن دارند. آیا زمان داده‌ها، عدم قطعیت و مهلت درخواست روشن است؟ این بررسی فقط ساختاری است و محتوای بالینی را تأیید نمی‌کند.'}
async function ctSubmitSbar(e){e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));d.urgent=f.elements.urgent.checked;d.deidentified=f.elements.deidentified.checked;await ctSendForm(f,{kind:'sbar',data:d})}
function ctRenderSkills(){const forms=serverUser.role==='student'?Object.entries(ctSkillNames).map(([id,title])=>'<form class="ct-card" onsubmit="ctSubmitSkill(event,\''+id+'\')"><h3>'+title+'</h3>'+ctSkillSteps[id].map((s,i)=>'<label><input type="checkbox" name="step'+i+'">'+s+'</label>').join('')+'<label>نام ناظر آموزشی حاضر<input name="supervisor" minlength="2" maxlength="100" required></label><label>اعتمادبه‌نفس از ۱ تا ۵<input type="range" name="confidence" min="1" max="5" value="3" oninput="this.nextElementSibling.textContent=ctNum(this.value)"><output>۳</output></label><label>بازتاب کوتاه<textarea name="note" maxlength="1000"></textarea></label><button>ثبت برای بازبینی</button></form>').join(''):'';const list=ctRows.map(row=>'<article class="ct-card"><div class="ct-row"><h3>'+ctSkillNames[row.data.skill]+'</h3><span class="ct-pill">'+ctNum(row.data.steps.filter(Boolean).length)+' از ۴ گام</span></div><div class="ct-meta">'+escape(row.owner_name)+' · '+ctDate(row.created)+'</div><p>ناظر: '+escape(row.data.supervisor)+' · اعتمادبه‌نفس '+ctNum(row.data.confidence)+' از ۵</p><p>'+escape(row.data.note)+'</p>'+ctReplyList(row)+ctReplyForm(row,true)+'</article>').join('');$('#ctContent').innerHTML='<div class="ct-notice">دفتر مهارت، ثبت تجربه و بازخورد است؛ سطح منتور مجوز اجرای مستقل نیست و تابع صلاحیت مصوب و نظارت محل است.</div>'+(forms?'<div class="ct-grid">'+forms+'</div><h2>ثبت‌های من</h2>':'')+(list||ctEmpty('هنوز مهارتی ثبت نشده است.'))}
async function ctSubmitSkill(e,id){e.preventDefault();const f=e.target;await ctSendForm(f,{kind:'skill',data:{skill:id,supervisor:f.elements.supervisor.value,confidence:Number(f.elements.confidence.value),note:f.elements.note.value,steps:[0,1,2,3].map(i=>f.elements['step'+i].checked)}})}
function ctRenderPulse(){if(serverUser.role!=='student')return;const trend=ctRows.slice(0,10).reverse();$('#ctContent').innerHTML='<div class="ct-grid"><article class="ct-card"><h2>حال من، برای خود من</h2><p>پنج پرسش خودگزارشی؛ ۱ = اصلاً، ۵ = کاملاً. این ابزار تشخیصی یا مقیاس پژوهشی معتبر نیست.</p><form onsubmit="ctSubmitPulse(event)">'+ctPulseQuestions.map((q,i)=>'<label>'+q+'<input type="range" name="score'+i+'" min="1" max="5" value="3" oninput="this.nextElementSibling.textContent=ctNum(this.value)"><output>۳</output></label>').join('')+'<label>بازتاب خصوصی امروز<textarea name="reflection" maxlength="2000"></textarea></label><label><input type="checkbox" name="contact"> فقط درخواست تماس را با منتور خودم به اشتراک بگذار؛ امتیازها و بازتاب خصوصی بمانند.</label><button>ثبت نبض امروز</button></form><div class="ct-notice rose">این بخش دائماً پایش نمی‌شود. اگر به کمک فوری نیاز داری، به فرد مورد اعتماد، تیم حاضر یا خدمات فوریت محل مراجعه کن.</div></article><div><article class="ct-card"><h2>روند شخصی من</h2><p class="ct-muted">میانگین پاسخ‌ها؛ روند توصیفی، بدون آستانهٔ تشخیصی. تا ۱۰ ثبت اخیر.</p><div class="ct-pulse-trend" role="img" aria-label="روند میانگین پاسخ‌های شخصی">'+trend.map(r=>{const score=r.data.scores.reduce((a,b)=>a+b,0)/5;return '<div class="ct-pulse-bar" style="height:'+score*24+'px" title="'+escape(ctDate(r.created))+'"><span>'+ctNum(score)+'</span><small>'+new Date(r.created).toLocaleDateString('fa-IR',{timeZone:'Asia/Tehran',day:'numeric',month:'numeric'})+'</small></div>'}).join('')+'</div>'+(trend.length?'':ctEmpty('با اولین ثبت، روندت اینجا نمایش داده می‌شود.'))+'</article><article class="ct-card"><h2>یک مکث کوتاه</h2><p>آرام و طبیعی نفس بکش؛ می‌توانی با نشانگر دم و بازدم همراه شوی. اگر ناراحت شدی توقف کن.</p><div class="ct-breath" id="ctBreathCircle">آماده</div><button class="secondary" onclick="ctToggleBreath()">شروع / توقف</button><p>تمرین توجه: پنج چیز که می‌بینی، چهار چیز که لمس می‌کنی، سه صدا، دو بو و یک طعم را نام ببر.</p></article></div></div>'+ctRows.map(r=>'<article class="ct-card"><div class="ct-meta">'+ctDate(r.created)+(r.data.contact?' · درخواست تماس ارسال شده':' · خصوصی')+'</div><p>'+escape(r.data.reflection||'بدون بازتاب نوشتاری')+'</p></article>').join('')}
async function ctSubmitPulse(e){e.preventDefault();const f=e.target;await ctSendForm(f,{kind:'pulse',data:{scores:[0,1,2,3,4].map(i=>Number(f.elements['score'+i].value)),contact:f.elements.contact.checked,reflection:f.elements.reflection.value}})}
function ctStopBreath(){if(ctBreath)clearInterval(ctBreath);ctBreath=null;const c=$('#ctBreathCircle');if(c){c.classList.remove('expand');c.textContent='آماده'}}
function ctToggleBreath(){if(ctBreath){ctStopBreath();return}const c=$('#ctBreathCircle');if(!c)return;let inhale=true;const tick=()=>{c.classList.toggle('expand',inhale);c.textContent=inhale?'دم آرام':'بازدم آرام';inhale=!inhale};tick();ctBreath=setInterval(tick,4000)}
let ctPollBusy=false;
setInterval(async()=>{if(ctPollBusy||ctBusy||ctTab!=='message'||!serverUser||document.visibilityState!=='visible'||!$('#continuity')?.classList.contains('active'))return;const sid=serverUser.role==='student'?serverUser.id:ctStudent;if(!sid)return;ctPollBusy=true;const epoch=ctEpoch;try{const r=await api('continuity/entries?kind=message&studentId='+encodeURIComponent(sid));if(epoch===ctEpoch&&r.entries.some(x=>!ctRows.some(y=>y.id===x.id)))$('#ctStatus').textContent='پیام تازه رسیده؛ برای دیدن آن تازه‌سازی را بزن. متن نوشته‌شده حفظ شده است.'}catch{}finally{ctPollBusy=false}},20000);
function ctRenderChat(){const other=serverUser.role==='student'?ctRoster.find(m=>m.id===serverUser.mentorId):ctRoster.find(m=>m.id===ctStudent);$('#ctContent').innerHTML='<article class="ct-card"><h2>گفت‌وگو با '+escape(other?.name||'همراه آموزشی')+'</h2><p class="ct-muted">متن کوتاه، مناسب اتصال ضعیف. دریافت پیام به معنی تأیید بالینی یا تعهد پاسخ فوری نیست.</p><div class="ct-chat">'+(ctRows.map(r=>'<div class="ct-bubble '+(r.owner_id===serverUser.id?'mine':'')+'"><div class="ct-meta">'+escape(r.owner_name)+'</div><p>'+escape(r.data.text)+'</p><div class="ct-meta">'+ctDate(r.created)+(r.owner_id===serverUser.id?' · '+(ctSeen&&r.created<=ctSeen?'دیده‌شده':'ارسال‌شده'):'')+'</div></div>').join('')||ctEmpty('گفت‌وگو را با یک پیام کوتاه شروع کن.'))+'</div><form onsubmit="ctSubmitMessage(event)"><label>پیام<textarea name="text" maxlength="4000" required></textarea></label><div class="ct-actions">'+['گزارش را دیدم؛ نکتهٔ اصلی را روشن‌تر بنویس.','برای جلسهٔ بعد چه چیزی را مرور کنم؟','لطفاً زمان مناسبی برای گفت‌وگو پیشنهاد بده.'].map(s=>'<button type="button" class="secondary" data-quick="'+escape(s)+'" onclick="this.closest(\'form\').elements.text.value=this.dataset.quick">'+s+'</button>').join('')+'</div><label><input type="checkbox" name="deidentified" required> پیام فاقد اطلاعات هویتی بیمار است.</label><button>ارسال پیام</button><button type="button" class="secondary" onclick="navigate(\'sessions\')">ورود به جلسات من</button></form></article>'}
async function ctSubmitMessage(e){e.preventDefault();const f=e.target;await ctSendForm(f,{kind:'message',studentId:serverUser.role==='student'?serverUser.id:ctStudent,data:{text:f.elements.text.value,deidentified:f.elements.deidentified.checked}})}
function ctRenderBoard(){const mentors=ctRoster.filter(m=>m.role==='mentor');const form=serverUser.role!=='student'?'<form class="ct-card" onsubmit="ctSubmitBoard(event)"><h2>یادداشت گروه منتور</h2>'+(serverUser.role==='admin'?'<label>گروه منتور<select name="mentorId">'+mentors.map(m=>'<option value="'+escape(m.id)+'">'+escape(m.name)+'</option>').join('')+'</select></label>':'')+'<label>عنوان<input name="title" minlength="2" maxlength="140" required></label><label>متن آموزشی / برنامهٔ مرور<textarea name="text" minlength="2" maxlength="4000" required></textarea></label><button>انتشار برای منتی‌های همین منتور</button></form>':'';$('#ctContent').innerHTML='<div class="ct-notice">تابلوی هر منتور برای منتی‌های مرتبط با اوست. بحث دانشجویی چندنفره در فروم موجود ادامه دارد.</div>'+form+ctRows.map(r=>'<article class="ct-card"><div class="ct-meta">'+escape(r.owner_name)+' · '+ctDate(r.created)+'</div><h3>'+escape(r.data.title)+'</h3><p>'+escape(r.data.text)+'</p></article>').join('')+(ctRows.length?'':ctEmpty('هنوز یادداشتی در تابلو نیست.'))}
async function ctSubmitBoard(e){e.preventDefault();const f=e.target;await ctSendForm(f,{kind:'board',mentorId:f.elements.mentorId?.value,data:{title:f.elements.title.value,text:f.elements.text.value}})}
async function ctLoadSupport(epoch){try{const r=await api('continuity/support');if(epoch!==ctEpoch||!$('#ctSupport'))return;$('#ctSupport').innerHTML=r.requests.length?'<article class="ct-card"><h2>درخواست همراهی؛ با رضایت منتی</h2><p class="ct-muted">فقط درخواست تماس نمایش داده می‌شود؛ امتیازها و بازتاب شخصی محرمانه‌اند.</p>'+r.requests.map(s=>'<div class="ct-row"><p>'+escape(s.name)+' · '+ctDate(s.created)+'</p><button class="secondary" onclick="ctAcknowledge(\''+s.id+'\')">تماس را پیگیری کردم</button></div>').join('')+'</article>':''}catch(e){$('#ctStatus').textContent='گزارش‌ها دریافت شد؛ درخواست‌های حمایت دریافت نشد: '+e.message}}
async function ctAcknowledge(id){try{await ctPost('continuity/reply',{id:crypto.randomUUID(),entryId:id,text:'درخواست همراهی توسط منتور پیگیری شد.'});ctOpen()}catch(e){notify(e.message)}}
function ctRenderReport(){const rows=ctReport.students,tot=key=>rows.reduce((n,r)=>n+(r[key]||0),0);$('#ctContent').innerHTML='<div class="ct-metrics"><div class="ct-metric">گزارش آموزشی<b>'+ctNum(tot('sbar'))+'</b></div><div class="ct-metric">تجربهٔ مهارتی<b>'+ctNum(tot('skills'))+'</b></div><div class="ct-metric">گزارش پاسخ‌گرفته<b>'+ctNum(tot('replied'))+'</b></div></div><article class="ct-card" style="overflow:auto"><h2>همراهی، به تفکیک منتی</h2><table class="ct-table"><thead><tr><th>منتی</th><th>گزارش</th><th>مهارت</th><th>روز فعالیت (UTC)</th><th>میانگین پاسخ منتور</th><th>پاسخ ≤۲۴ ساعت</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+escape(r.name)+'</td><td>'+ctNum(r.sbar)+'</td><td>'+ctNum(r.skills)+'</td><td>'+ctNum(r.activeDays)+'</td><td>'+(r.averageHours===null?'—':ctNum(r.averageHours)+' ساعت')+'</td><td>'+ctNum(r.within24)+' / '+ctNum(r.replied)+'</td></tr>').join('')+'</tbody></table>'+(rows.length?'':ctEmpty('منتی‌ای برای این حساب ثبت نشده است.'))+'<p class="ct-muted">میانگین پاسخ فقط گزارش‌هایی را شامل می‌شود که اولین پاسخ منتور دارند؛ موارد بی‌پاسخ در مخرج نیستند. این شاخص تعهد پاسخ‌گویی نیست.</p><button class="secondary" onclick="ctExportReport()" '+(ctReport.exportAllowed?'':'disabled')+'>CSV تجمعی آموزش</button><p class="ct-muted">خروجی فقط شمارش کل آموزش بدون نام، پیام یا نبض شخصی است؛ برای گروه‌های زیر ۵ منتی غیرفعال است. برای پژوهش رسمی نیاز به طراحی و رضایت مناسب وجود دارد.</p></article>'}
function ctDownload(name,value,type='application/json'){const url=URL.createObjectURL(new Blob([value],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function ctExportReport(){if(!ctReport?.exportAllowed)return;const rows=ctReport.students,tot=k=>rows.reduce((n,r)=>n+(r[k]||0),0);ctDownload('continuity-aggregate.csv','\uFEFFmetric,count\nmentees,'+rows.length+'\nsbar,'+tot('sbar')+'\nskills,'+tot('skills')+'\nreplied,'+tot('replied')+'\nwithin24,'+tot('within24')+'\n','text/csv;charset=utf-8')}
function ctRenderLibrary(q=''){const results=continuitySearch(q);$('#ctContent').innerHTML='<article class="ct-card"><h2>از پرسش به منبع</h2><p>جست‌وجوی متنی در کارت‌های آموزشی منتخبِ برگرفته از ایده‌های نوت‌بوک؛ پاسخ تولیدی هوش مصنوعی یا مشاورهٔ بیمار نیست. متن کامل دستورالعمل را در منبع اصلی بررسی کن.</p><form onsubmit="event.preventDefault();ctRenderLibrary(this.elements.query.value)"><label for="ctLibraryQuery">موضوع یا پرسش آموزشی</label><input id="ctLibraryQuery" name="query" class="ct-search" maxlength="300" value="'+escape(q)+'" placeholder="مثلاً تحویل، سوختگی، فشار روانی یا اینترنت ضعیف"><button style="margin-top:10px">جست‌وجو</button></form><p class="ct-muted">منابع پایه: WHO/ICRC BEC، AHRQ SBAR و WHO PFA؛ بررسی پیوندها: ۱ نوامبر ۲۰۲۶. این کارت‌ها دستورالعمل جامع یا تازه‌ترین پروتکل محل نیستند.</p></article><div class="ct-grid">'+(results.map(c=>{const s=continuitySources[c.source];return '<article class="ct-card ct-library"><span class="ct-pill">یادداشت آموزشی · '+escape(c.id.toUpperCase())+'</span><h3>'+escape(c.title)+'</h3><p>'+escape(c.text)+'</p><details><summary>پرسش‌های مرور با منتور</summary><ul>'+c.prompts.map(p=>'<li>'+escape(p)+'</li>').join('')+'</ul></details><p class="ct-muted">'+escape(s.year)+'</p><a href="'+s.url+'" target="_blank" rel="noopener noreferrer">منبع اصلی: '+escape(s.title)+' ↗</a></article>'}).join('')||ctEmpty('کارت مرتبط پیدا نشد. با موضوع کوتاه‌تر جست‌وجو کن یا از منتورت بپرس.'))+'</div>'}
async function ctSendForm(form,record){if(ctBusy)return;ctBusy=true;const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const result=await ctPost('continuity/entries',{id:crypto.randomUUID(),...record});form.reset();notify(result.queued?'روی همین دستگاه در صف ذخیره شد؛ هنوز ارسال نشده.':'ثبت شد.');ctBusy=false;if(!result.queued)await ctOpen();else ctQueueStatus()}catch(e){$('#ctStatus').textContent='ثبت انجام نشد؛ متن فرم حفظ شده است. '+e.message}finally{ctBusy=false;buttons.forEach(b=>b.disabled=false)}}
async function ctReply(e,id){e.preventDefault();const f=e.target;if(ctBusy)return;ctBusy=true;try{const result=await ctPost('continuity/reply',{id:crypto.randomUUID(),entryId:id,text:f.elements.text.value,...(f.elements.level?{level:Number(f.elements.level.value)}:{})});f.reset();notify(result.queued?'بازخورد در صف دستگاه است.':'بازخورد ثبت شد.');ctBusy=false;if(!result.queued)ctOpen()}catch(err){$('#ctStatus').textContent='ارسال انجام نشد: '+err.message}finally{ctBusy=false}}
async function ctPost(path,payload){try{return await api(path,'POST',payload)}catch(e){if(!e.status&&(!navigator.onLine||e instanceof TypeError)&&$('#ctOfflineConsent')?.checked){const rows=ctOut();if(rows.length>=20)throw new Error('صف پر است؛ ابتدا همگام‌سازی یا پشتیبان بگیر.');ctStore([...rows,{owner:serverUser.id,created:Date.now(),path,payload}]);return {queued:true}}throw e}}
async function ctSync(){ctQueueStatus();if(ctBusy||!navigator.onLine||!ctOut().length)return;ctBusy=true;try{const me=await api('me');if(me.user.id!==serverUser.id)throw new Error('حساب تغییر کرده؛ صفحه را دوباره باز کن.');let rows=ctOut();while(rows.length){const r=rows[0];await api(r.path,'POST',r.payload);rows=rows.slice(1);ctStore(rows)}notify('صف با حساب مربوطه همگام شد.');ctBusy=false;if($('#continuity').classList.contains('active'))ctOpen()}catch(e){if($('#ctStatus'))$('#ctStatus').textContent='ارسال صف متوقف شد؛ ثبت‌های ارسال‌نشده حفظ شدند: '+e.message}finally{ctBusy=false;ctQueueStatus()}}
function ctExportQueue(){ctDownload('clinical-bridge-pending.json',JSON.stringify({version:1,member:serverUser.id,records:ctOut()},null,2))}
function ctClearQueue(){if(!ctOut().length)return;if(confirm('ثبت‌های ارسال‌نشدهٔ همین حساب از این دستگاه پاک شوند؟ ابتدا می‌توانی پشتیبان بگیری.'))ctStore([])}
async function ctImportPractice(input){try{const file=input.files?.[0];if(!file)return;if(file.size>30000)throw new Error('فایل بیش از حد بزرگ است.');const j=JSON.parse(await file.text());if(j.type!=='clinical-bridge-sbar-practice-v1'||!j.data)throw new Error('فایل پیش‌نویس معتبر نیست.');const f=$('#ctSbarForm');for(const k of ['title','s','b','a','r']){if(typeof j.data[k]!=='string'||j.data[k].length>(k==='title'?140:2000))throw new Error('متن پیش‌نویس معتبر نیست.')}for(const k of ['title','s','b','a','r'])f.elements[k].value=j.data[k];f.elements.deidentified.checked=false;notify('پیش‌نویس وارد شد؛ بازبینی و حذف اطلاعات هویتی را پیش از ارسال تأیید کن.')}catch(e){notify(e.message)}finally{input.value=''}}
async function ctImportQueue(input){try{const file=input.files?.[0];if(!file)return;if(!$('#ctOfflineConsent')?.checked)throw new Error('ابتدا شخصی بودن دستگاه را تأیید کن.');if(file.size>250000)throw new Error('فایل بیش از حد بزرگ است.');const j=JSON.parse(await file.text());if(j.version!==1||j.member!==serverUser.id||!Array.isArray(j.records)||j.records.length>20)throw new Error('این پشتیبان مربوط به حساب فعلی نیست یا معتبر نیست.');for(const r of j.records){if(r.owner!==serverUser.id||!['continuity/entries','continuity/reply'].includes(r.path)||!r.payload||typeof r.payload.id!=='string'||!Number.isFinite(r.created)||r.created>Date.now()+60000||r.created<Date.now()-7*86400000)throw new Error('یکی از ثبت‌ها نامعتبر یا قدیمی است.')}const map=new Map(ctOut().map(r=>[r.payload.id,r]));j.records.forEach(r=>map.set(r.payload.id,r));if(map.size>20)throw new Error('مجموع ثبت‌ها بیشتر از ظرفیت صف است.');ctStore([...map.values()]);notify('پشتیبان بازیابی شد؛ برای ارسال دکمهٔ ارسال صف را بزن.')}catch(e){notify(e.message)}finally{input.value=''}}
const ctNavigation=navigate;navigate=function(id){ctNavigation(id);if(id==='continuity')ctOpen();else{ctStopBreath();ctEpoch++}};
</script>
