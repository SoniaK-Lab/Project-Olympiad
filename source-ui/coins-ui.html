<style>
.growth-wallet-chip{display:flex;align-items:center;gap:8px;background:#fcf0d9;color:#9e8157;border:1px solid #ead8b6;border-radius:11px;padding:9px 12px;font-size:12px;white-space:nowrap}.growth-wallet-chip b{font-variant-numeric:tabular-nums}.growth-wallet-chip.received{animation:coin-pop .8s ease}header:has(.growth-wallet-chip){gap:12px;flex-wrap:wrap;height:auto;min-height:89px;padding:14px 0}.growth-hero{padding:29px 31px;border:1px solid #d6e1ec;border-radius:22px;background:linear-gradient(120deg,#e4eff9,#f8e8ee);display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.growth-hero h1{font-size:28px;color:#2c536c;margin:9px 0;line-height:1.7}.growth-hero p{font-size:12px;color:#8296a8;line-height:2;max-width:620px}.growth-coin-art{height:90px;width:90px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#fff5df,#e8c99e);border:6px double #b9976990;box-shadow:0 8px 0 #c4a57d55,0 18px 30px #8f765c11;display:grid;place-items:center;color:#ac8959;font-size:35px}.growth-overview{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-bottom:25px}.growth-wallet{padding:26px;border-radius:20px;background:#224a5e;color:#dfedf6;position:relative;overflow:hidden}.growth-wallet:after{content:'';position:absolute;width:180px;height:180px;left:-60px;top:-65px;border:1px solid #d9eaf222;border-radius:50%;box-shadow:0 0 0 25px #d9eaf208,0 0 0 50px #d9eaf205}.growth-wallet>*{position:relative;z-index:1}.growth-wallet .eyebrow{color:#bfd6e5}.growth-balance{font-size:46px;line-height:1.8;color:#f1d7b4;letter-spacing:1px}.growth-balance small{font-size:12px;letter-spacing:0;color:#d4dfe8}.growth-wallet-bottom{display:flex;gap:25px;margin-top:12px;font-size:11px;color:#aac8da}.growth-wallet-bottom b{color:#dce9f2;display:block;font-size:17px;margin-top:5px}.growth-next{border:1px solid #e3e2df;border-radius:20px;background:#fffdf8;padding:23px;display:flex;align-items:center;gap:20px}.growth-next svg{width:92px;height:92px;flex-shrink:0}.growth-next h2{font-size:15px;line-height:1.9;color:#5c7b92}.growth-next p{font-size:11px;line-height:2;color:#8b9dac}.growth-progress-circle{fill:none;stroke:#d7a5be;stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .4s}.growth-title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:25px 0 16px}.growth-title-row h2{font-size:19px;color:#486d85}.growth-title-row button{font-size:11px;padding:9px 13px}.growth-market{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.growth-item{border:1px solid #dce4ec;border-radius:17px;background:#fffdf7;padding:23px}.growth-item h3{font-size:16px;color:#4c718a;margin:16px 0 8px}.growth-item p{font-size:11px;line-height:2;color:#8a9eae;min-height:45px}.growth-preview{height:94px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#f7e8ef;position:relative;overflow:hidden}.growth-preview.frame-rose span{display:grid;place-items:center;width:51px;height:51px;border:4px solid #d8a6c0;outline:3px solid #f8dce9;background:#fffaf7;color:#ac7b96;border-radius:50%;font-size:21px}.growth-preview.monitor-sky{background:#dfeefa}.growth-preview.monitor-sky span{background:#305d78;border:3px solid #aac8de;border-radius:11px;width:110px;height:57px;display:flex;align-items:center;justify-content:center;color:#cfe8f4;font-size:30px}.growth-preview.journal-cream{background:#f4ecdf}.growth-preview.journal-cream span{background:repeating-linear-gradient(#fff9e9,#fff9e9 13px,#e9dcc2 14px);border:1px solid #ded0b6;border-radius:7px;width:73px;height:65px;border-right:5px solid #ceaf92;transform:rotate(-6deg)}.growth-price{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:16px 0;font-size:12px;color:#ac8e60}.growth-price small{color:#9bacb8;font-size:10px}.growth-item button{width:100%;font-size:11px;background:#e8f0fa;color:#6388a7;border:1px solid #d4e2ef}.growth-item button:disabled{opacity:.55;cursor:default}.growth-item button.owned{background:#f7e7ef;color:#ab7a95;border-color:#e9cddd}.growth-bottom{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}.growth-bottom .panel{padding:24px}.growth-bottom h2{font-size:16px;color:#5c7d95;margin-bottom:16px}.growth-rule{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #ebe6e1;font-size:12px;color:#8098ab;line-height:1.9}.growth-rule b{color:#a98b5b;white-space:nowrap}.growth-note{font-size:11px;color:#8fa0ad;line-height:2;margin-top:16px}.growth-event{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e9e5e3}.growth-event-icon{height:32px;width:32px;border-radius:11px;background:#f9ecd5;color:#b99a68;display:grid;place-items:center;flex-shrink:0}.growth-event.negative .growth-event-icon{background:#f6e5ee;color:#b3809c}.growth-event p{font-size:11px;color:#7a95aa;line-height:1.8;flex:1}.growth-event small{display:block;font-size:9px;color:#a1aab5}.growth-event strong{font-size:13px;color:#aa8d60;direction:ltr;white-space:nowrap}.growth-event.negative strong{color:#af8099}.growth-empty{padding:16px 0;font-size:12px;line-height:2;color:#8a9eaf}.growth-load{font-size:11px;color:#8ca0b0;line-height:2;min-height:20px;margin-bottom:15px}.growth-report{width:100%;border-collapse:collapse;font-size:12px}.growth-report th,.growth-report td{text-align:right;padding:15px 12px;border-bottom:1px solid #e4e6ec}.growth-report th{color:#708ba0;background:#eef3fa}.growth-report td{color:#7d92a2}.growth-report td strong{color:#aa8c61}.growth-privacy{background:#f6e9ef;border:1px solid #e9cfdd;border-radius:12px;padding:15px 18px;font-size:11px;color:#a08094;line-height:2;margin-top:20px}body[data-growth-frame=rose] aside .profile .avatar{outline:3px solid #d5a3bd;outline-offset:3px;box-shadow:0 0 0 7px #f6e3ed}body[data-growth-monitor=sky] .vp-monitor{background:linear-gradient(135deg,#285671,#3f6d88)}body[data-growth-journal=cream] #roomNotes{background:#fff7e4}body[data-growth-journal=cream] #roomNote{background:#fffbed;border-color:#e4d3b8}@keyframes coin-pop{30%{transform:scale(1.12);box-shadow:0 0 0 7px #ead2a22b}100%{transform:scale(1)}}@media(max-width:1000px){.growth-market{grid-template-columns:1fr 1fr}.growth-overview,.growth-bottom{grid-template-columns:1fr}.growth-next{justify-content:flex-start}.growth-report{min-width:480px}}@media(max-width:600px){.growth-market{grid-template-columns:1fr}.growth-hero{padding:23px}.growth-hero h1{font-size:23px}.growth-coin-art{height:60px;width:60px;font-size:25px}.growth-wallet{padding:22px}.growth-next{padding:19px;gap:14px}.growth-balance{font-size:39px}.growth-report th,.growth-report td{padding:13px 9px}}@media(prefers-reduced-motion:reduce){.growth-wallet-chip.received{animation:none}.growth-progress-circle{transition:none}}
</style>
<script>
let growthData=null,growthEpoch=0,growthMutation=false;
function setupGrowthCoins(){const student=serverUser.role==='student';const nav=document.createElement('button');nav.dataset.view='growth-coins';nav.innerHTML='<span>◉</span>'+(student?'سکهٔ رشد':'گزارش سکهٔ رشد');nav.onclick=()=>navigate('growth-coins');document.querySelector('nav').append(nav);const section=document.createElement('section');section.id='growth-coins';section.className='view';section.innerHTML='<div class="growth-hero"><div><span class="tag">ارزشِ تلاش و اصلاح</span><h1>سکهٔ رشد</h1><p>'+(student?'هر بار که با بازخورد جلو می‌روی، تلاش تو دیده می‌شود؛ سکه جمع کن و فضای یادگیری خودت را شخصی‌تر کن.':'گزارش فعالیت‌های تأییدشده و سکه‌های هر منتی؛ برای همراهی با مسیر رشد او.')+'</p></div><div class="growth-coin-art" aria-hidden="true">✦</div></div><div class="growth-title-row"><h2>'+(student?'کیف و پاداش‌های تو':'گزارش منتی‌ها')+'</h2><button class="secondary" onclick="loadGrowthCoins()">تازه‌سازی سکه‌ها</button></div><p class="growth-load" id="growthStatus" role="status"></p><div id="growthContent"></div>';document.querySelector('footer').before(section);if(student){const chip=document.createElement('button');chip.className='growth-wallet-chip';chip.id='growthHeaderChip';chip.setAttribute('aria-label','مشاهدهٔ کیف سکهٔ رشد');chip.innerHTML='<span aria-hidden="true">◉</span><b id="growthHeaderBalance">—</b><span>سکه</span>';chip.onclick=()=>navigate('growth-coins');document.querySelector('header').append(chip);loadGrowthCoins();setInterval(()=>{if(document.visibilityState==='visible')loadGrowthCoins(false)},60000)}}
function applyGrowthRewards(){if(serverUser.role!=='student'||!growthData)return;const has=sku=>growthData.inventory.some(i=>i.sku===sku&&i.equipped);document.body.dataset.growthFrame=has('frame-rose')?'rose':'';document.body.dataset.growthMonitor=has('monitor-sky')?'sky':'';document.body.dataset.growthJournal=has('journal-cream')?'cream':'';$('#growthHeaderBalance').textContent=growthData.balance.toLocaleString('fa-IR');const key='bridge-growth-earned-'+serverUser.id,previous=sessionStorage.getItem(key);if(previous!==null&&growthData.earned>Number(previous)){notify((growthData.earned-Number(previous)).toLocaleString('fa-IR')+' سکهٔ رشد به دست آوردی ✦');const chip=$('#growthHeaderChip');chip.classList.add('received');setTimeout(()=>chip.classList.remove('received'),900)}sessionStorage.setItem(key,String(growthData.earned))}
async function loadGrowthCoins(showStatus=true){if(!$('#growthContent')||growthMutation)return;const epoch=++growthEpoch;if(showStatus)$('#growthStatus').textContent='در حال دریافت سکه‌ها…';try{const result=await api(serverUser.role==='student'?'coins':'coins/report');if(epoch!==growthEpoch)return;growthData=result;if(serverUser.role==='student')applyGrowthRewards();renderGrowthCoins();$('#growthStatus').textContent='بر اساس فعالیت‌های تأییدشده، به‌روز شد.'}catch(e){if(epoch===growthEpoch)$('#growthStatus').textContent='دریافت سکه‌ها انجام نشد: '+e.message}}
function growthRules(){return '<h2>چطور سکه می‌گیرم؟</h2>'+growthData.rules.map(r=>'<div class="growth-rule"><span>'+escape(r.label)+'</span><b>+'+r.amount.toLocaleString('fa-IR')+' سکه</b></div>').join('')+'<p class="growth-note">هر تکلیف فقط یک‌بار پاداش تأیید و یک‌بار پاداش اصلاح می‌گیرد. پاداش اصلاح پس از ارسال دوباره و تأیید نهایی محاسبه می‌شود. تازه‌سازی، تکرار تمرین یا لایک فروم سکه ایجاد نمی‌کند.</p><p class="growth-note">منابع ضروری و کوله‌پشتی بحران بدون نیاز به سکه در دسترس‌اند. سکه امتیاز آموزشی است و ارزش پولی ندارد.</p>'}
function renderGrowthCoins(){if(!growthData)return;if(serverUser.role!=='student'){$('#growthContent').innerHTML='<div class="panel" style="overflow:auto"><table class="growth-report"><thead><tr><th>منتی</th><th>سکهٔ کسب‌شده</th><th>خرج‌شده</th><th>موجودی</th></tr></thead><tbody>'+growthData.students.map(s=>'<tr><td>'+escape(s.name)+'</td><td>'+s.earned.toLocaleString('fa-IR')+'</td><td>'+s.spent.toLocaleString('fa-IR')+'</td><td><strong>'+s.balance.toLocaleString('fa-IR')+'</strong></td></tr>').join('')+'</tbody></table>'+(growthData.students.length?'':'<p class="growth-empty">هنوز منتی‌ای برای این حساب ثبت نشده است.</p>')+'</div><div class="growth-privacy">این گزارش رتبه‌بندی عمومی نیست. منتور فقط منتی‌های مربوط به خودش را می‌بیند؛ سکه‌ها معیار رسمی صلاحیت بالینی نیستند.</div><div class="panel" style="margin-top:20px">'+growthRules()+'</div>';return}const d=growthData,owned=sku=>d.inventory.find(i=>i.sku===sku),next=d.catalog.filter(p=>!owned(p.sku)).sort((a,b)=>a.price-b.price)[0],remaining=next?Math.max(0,next.price-d.balance):0,percent=next?Math.min(100,Math.round(d.balance/next.price*100)):100;$('#growthContent').innerHTML=`<div class="growth-overview"><div class="growth-wallet"><span class="eyebrow">موجودی قابل استفاده</span><div class="growth-balance">${d.balance.toLocaleString('fa-IR')} <small>سکهٔ رشد</small></div><div class="growth-wallet-bottom"><span>کل سکه‌های کسب‌شده<b>${d.earned.toLocaleString('fa-IR')}</b></span><span>سکه‌های استفاده‌شده<b>${d.spent.toLocaleString('fa-IR')}</b></span></div></div><div class="growth-next"><svg viewBox="0 0 100 100" role="img" aria-label="${percent} درصد از هزینهٔ پاداش بعدی"><circle cx="50" cy="50" r="40" fill="none" stroke="#e9e3df" stroke-width="7"/><circle class="growth-progress-circle" cx="50" cy="50" r="40" stroke-dasharray="251.33" stroke-dashoffset="${251.33*(1-percent/100)}"/><text x="50" y="55" text-anchor="middle" fill="#a57d94" font-size="17">${percent.toLocaleString('fa-IR')}٪</text></svg><div><h2>${next?(remaining?'تا '+escape(next.title):'یک جایزه در دسترس توست'):'ویترینت کامل شد ✦'}</h2><p>${next?(remaining?remaining.toLocaleString('fa-IR')+' سکهٔ دیگر تا دریافت این جایزه.':'می‌توانی «'+escape(next.title)+'» را از ویترین دریافت کنی.'):'همهٔ جایزه‌های فعلی را داری؛ هر وقت خواستی ظاهرشان را فعال یا غیرفعال کن.'}</p></div></div></div><div class="growth-title-row"><h2>ویترین پاداش‌ها</h2><span class="tag">جایزه‌های ظاهری، فقط برای پنل خودت</span></div><div class="growth-market">${d.catalog.map(p=>{const item=owned(p.sku);return `<article class="growth-item"><div class="growth-preview ${p.sku}" aria-hidden="true"><span>${p.kind==='frame'?'✦':p.kind==='monitor'?'⌁':''}</span></div><h3>${escape(p.title)}</h3><p>${escape(p.description)}</p><div class="growth-price"><b>◉ ${p.price.toLocaleString('fa-IR')} سکه</b><small>${item?'دریافت شده':d.balance<p.price?'نیاز به سکهٔ بیشتر':'آمادهٔ دریافت'}</small></div>${item?'<button class="owned" aria-pressed="'+Boolean(item.equipped)+'" onclick="equipGrowthReward(\''+p.sku+'\','+!item.equipped+',this)">'+(item.equipped?'فعال است · غیرفعال‌کردن':'فعال‌کردن جایزه')+'</button>':'<button onclick="purchaseGrowthReward(\''+p.sku+'\',this)" '+(d.balance<p.price?'disabled':'')+'>دریافت با '+p.price.toLocaleString('fa-IR')+' سکه ←</button>'}</article>`}).join('')}</div><div class="growth-bottom"><div class="panel">${growthRules()}</div><div class="panel"><h2>گردش‌های اخیر کیف</h2>${d.ledger.length?d.ledger.map(e=>'<div class="growth-event '+(e.amount<0?'negative':'')+'"><span class="growth-event-icon" aria-hidden="true">'+(e.amount<0?'◇':'✦')+'</span><p>'+escape(e.label)+'<small>'+new Date(e.created).toLocaleString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</small></p><strong>'+(e.amount>0?'+':'−')+Math.abs(e.amount).toLocaleString('fa-IR')+'</strong></div>').join(''):'<p class="growth-empty">اولین تکلیف تأییدشده‌ات را انجام بده تا این مسیر شروع شود. اگر پاسخ را با بازخورد اصلاح کنی و تأیید بگیری، پاداش بیشتری می‌گیری.</p>'}</div></div>`}
async function purchaseGrowthReward(sku,button){button.disabled=true;growthMutation=true;growthEpoch++;try{growthData=await api('coins/purchase','POST',{sku});applyGrowthRewards();renderGrowthCoins();notify(growthData.alreadyOwned?'این جایزه را از قبل داری.':'جایزه دریافت و فعال شد ✦')}catch(e){notify(e.message);button.disabled=false}finally{growthMutation=false}}
async function equipGrowthReward(sku,enabled,button){button.disabled=true;growthMutation=true;growthEpoch++;try{growthData=await api('coins/equip','PUT',{sku,enabled});applyGrowthRewards();renderGrowthCoins();notify(enabled?'ظاهر جایزه فعال شد.':'ظاهر جایزه غیرفعال شد.')}catch(e){notify(e.message);button.disabled=false}finally{growthMutation=false}}
const growthNavigation=navigate;navigate=function(id){growthNavigation(id);if(id==='growth-coins')loadGrowthCoins()};
const growthAssignmentAction=assignmentAction;assignmentAction=async function(action,payload){await growthAssignmentAction(action,payload);if(serverUser.role==='student')loadGrowthCoins(false)};
</script>
