<style>
.forum-hero{background:linear-gradient(120deg,#e2effa,#f9e9ef);border:1px solid #d8e3ed;border-radius:23px;padding:27px 30px;display:flex;justify-content:space-between;gap:22px;align-items:center;margin-bottom:20px}.forum-hero h1{font-size:27px;color:#294f65;line-height:1.7;margin:8px 0}.forum-hero p{font-size:12px;color:#7890a2;line-height:2}.forum-bubbles{width:145px;height:106px;position:relative;flex-shrink:0}.forum-bubbles span{position:absolute;border-radius:18px;background:#fffdf8;border:1px solid #d3e2f0;box-shadow:0 9px 23px #32546b0c;padding:15px 20px;color:#7098b9;font-size:22px}.forum-bubbles span:first-child{right:0;top:3px;transform:rotate(-8deg)}.forum-bubbles span:last-child{left:0;bottom:0;background:#f8dfe9;color:#af8097;transform:rotate(8deg)}.forum-intro{padding:13px 17px;border:1px solid #e3dcd3;border-radius:12px;background:#fff9ed;font-size:11px;line-height:2;color:#8b7b68;margin-bottom:20px}.forum-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}.forum-sidebar{background:#fffdf7;border:1px solid #e3e2df;border-radius:17px;padding:17px}.forum-sidebar h2{font-size:12px;color:#7891a5;margin:0 0 12px}.forum-sidebar button{display:flex;align-items:center;gap:9px;width:100%;text-align:right;padding:11px 12px;margin:4px 0;background:transparent;color:#6f889b;border-radius:10px;font-size:12px}.forum-sidebar button.selected{background:#e4effa;color:#3e6888}.forum-sidebar button:nth-of-type(3n){color:#a37c94}.forum-sidebar .forum-side-note{font-size:10px;color:#92a0ac;line-height:2;padding:14px 4px 0;border-top:1px solid #ece5e0;margin-top:13px}.forum-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.forum-tools input{flex:1;min-width:160px;padding:12px 14px;font-size:12px;border-radius:11px}.forum-tools select{width:145px;padding:12px;font-size:11px;border-radius:11px}.forum-tools button{padding:12px 15px;font-size:11px}.forum-status{display:block;color:#869bad;font-size:10px;min-height:20px;margin-bottom:8px}.forum-topic-card{border:1px solid #e1e5ea;border-radius:16px;background:#fffdf8;padding:21px;margin-bottom:13px;transition:border-color .15s,box-shadow .15s}.forum-topic-card:hover{border-color:#b7cddd;box-shadow:0 8px 25px #2c546b08}.forum-topic-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:11px}.forum-chip{font-size:9px;border-radius:20px;padding:4px 9px;background:#e9f1fb;color:#7393af}.forum-chip.pinned{background:#f6e6ee;color:#ac7e97}.forum-chip.locked{background:#eee9e1;color:#978d80}.forum-title-button{font-size:16px;font-weight:700;line-height:1.9;color:#325a72;padding:0;background:transparent;text-align:right;display:block}.forum-excerpt{font-size:12px;line-height:2;color:#8194a4;margin:9px 0 15px;white-space:pre-wrap;overflow-wrap:anywhere}.forum-topic-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:10px;color:#8b9aa8}.forum-author{display:flex;align-items:center;gap:8px}.forum-avatar{width:29px;height:29px;display:grid;place-items:center;border-radius:10px;background:#f1dfe9;color:#b17f9b;font-size:10px;flex-shrink:0}.forum-no-topics{background:#fffcf7;border:1px dashed #cfdce8;border-radius:18px;padding:40px 25px;text-align:center}.forum-no-topics .forum-empty-icon{font-size:34px;color:#c292ac;margin-bottom:15px}.forum-no-topics h2{font-size:17px;color:#59788f}.forum-no-topics p{font-size:12px;line-height:2;margin:12px 0 20px}.forum-no-topics button{font-size:12px}.forum-form{max-width:680px;background:#fffdf8;border:1px solid #dce5ed;border-radius:18px;padding:25px;margin-bottom:22px}.forum-form h2{font-size:19px;color:#3d627a}.forum-form p{font-size:11px;line-height:2;margin:10px 0}.forum-form label{display:block;font-size:12px;margin:15px 0 7px}.forum-form input,.forum-form select,.forum-form textarea{width:100%;font-size:12px;line-height:2;padding:12px 14px;border-radius:10px}.forum-form .actions button{font-size:11px}.forum-thread-toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:17px}.forum-thread-toolbar button{font-size:11px;padding:10px 14px}.forum-original{border:1px solid #d7e3ed;background:linear-gradient(145deg,#fffcf7,#f3f7fc);border-radius:19px;padding:26px;margin-bottom:20px}.forum-original h2{color:#315970;font-size:23px;line-height:1.9;margin:14px 0}.forum-message-body{font-size:13px;line-height:2.2;white-space:pre-wrap;overflow-wrap:anywhere;color:#637d90;margin:17px 0}.forum-moderation{border-top:1px solid #e2e4ea;padding-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.forum-moderation button{font-size:10px;padding:8px 12px;background:#edf2fa;color:#6b8ba5;border:1px solid #d8e3ef}.forum-moderation button.forum-delete{color:#a67891;background:#f9edf2;border-color:#edd4e0}.forum-reply-heading{font-size:15px;color:#6c879d;margin:25px 0 15px}.forum-post{padding:21px 23px;border:1px solid #e4e4e8;border-radius:15px;background:#fffdf8;margin-bottom:13px}.forum-post-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:10px;color:#9b9eaa}.forum-post-actions{display:flex;gap:8px;align-items:center;margin-top:12px}.forum-post-actions button{background:#eef3fa;border:1px solid #dce6f0;color:#7d96ab;font-size:10px;padding:7px 11px;border-radius:9px}.forum-post-actions button[aria-pressed=true]{background:#f7e3ed;color:#ad7d98;border-color:#e6c8d9}.forum-post-actions button.forum-delete{background:transparent;color:#a28c99;border-color:transparent}.forum-post.deleted{background:#f8f4ed;color:#a29b92;font-size:11px;padding:17px}.forum-reply-form{padding:23px;border:1px solid #d6e3ef;border-radius:17px;background:#eef4fb;margin-top:21px}.forum-reply-form label{font-size:14px;color:#52748f;display:block;margin-bottom:12px}.forum-reply-form textarea{width:100%;font-size:12px;line-height:2;padding:14px;min-height:140px;border-radius:12px}.forum-reply-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px}.forum-reply-footer span{font-size:10px;color:#899faf}.forum-reply-footer button{font-size:12px;background:#315a73}.forum-locked-note{padding:18px;background:#f5e9ee;color:#a17c92;border:1px solid #ead2df;border-radius:12px;font-size:12px;line-height:2;margin-top:20px}.forum-more{font-size:11px;margin:10px 0;padding:10px 18px}.forum-danger-dialog{max-width:430px}.forum-danger-dialog h2{font-size:18px}.forum-danger-dialog p{font-size:12px;line-height:2;margin:14px 0}.forum-section-error{border:1px solid #ebcfdd;padding:16px;border-radius:12px;background:#faeff3;color:#9a758c;font-size:12px;line-height:2}@media(max-width:1000px){.forum-layout{grid-template-columns:1fr}.forum-sidebar{display:flex;flex-wrap:wrap;gap:5px;padding:12px}.forum-sidebar h2,.forum-side-note{display:none}.forum-sidebar button{width:auto;margin:0;font-size:11px;padding:8px 10px}.forum-bubbles{width:110px}}@media(max-width:600px){.forum-hero{padding:22px}.forum-hero h1{font-size:22px}.forum-bubbles{display:none}.forum-tools select{width:130px}.forum-original,.forum-post{padding:18px}.forum-original h2{font-size:19px}.forum-form{padding:18px}.forum-reply-footer{align-items:flex-start;flex-direction:column}}
</style>
<script>
let forumTopics=[],forumPosts=[],forumCurrent=null,forumNext=null,forumPostNext=null,forumCategory='',forumListEpoch=0,forumThreadEpoch=0,forumSearchTimer=null,forumDeleteAction=null;
const forumCategories=['گفت‌وگوی عمومی','داخلی','جراحی','کودکان','کیس و استدلال','روش مطالعه'];
function forumDraftKey(kind){return 'bridge-forum-'+serverUser.id+'-'+kind}
function forumDate(value){return new Date(value).toLocaleString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function forumAuthor(name){return '<span class="forum-author"><span class="forum-avatar" aria-hidden="true">'+escape(name.slice(0,2))+'</span>'+escape(name)+'</span>'}
function setupForum(){if(!['student','admin'].includes(serverUser.role))return;const nav=document.createElement('button');nav.dataset.view='forum';nav.innerHTML='<span>☷</span>'+(serverUser.role==='admin'?'نظارت بر فروم':'فروم دانشجویی');nav.onclick=()=>navigate('forum');document.querySelector('nav').append(nav);const section=document.createElement('section');section.id='forum';section.className='view';section.innerHTML=`<div class="forum-hero"><div><span class="tag">فضای مشترک منتی‌ها</span><h1>اینجا از هم یاد می‌گیریم.</h1><p>یک سؤال خوب بپرس؛ تجربه‌ات را بنویس؛ به استدلال هم‌کلاسی‌ها کمک کن.</p></div><div class="forum-bubbles" aria-hidden="true"><span>···</span><span>✦</span></div></div><div class="forum-intro">بحث‌ها و نام نویسنده برای همهٔ منتی‌های مجاز و مدیر ناظر قابل مشاهده‌اند. اطلاعات شناسایی بیمار، تصویر پرونده یا یادداشت خصوصی را منتشر نکنید. پاسخ‌های هم‌کلاسی‌ها راهنمای درمان بیمار واقعی نیستند.</div><div id="forumListView"><div class="forum-form" id="forumComposer" hidden><form id="forumTopicForm"><h2>یک بحث تازه باز کن.</h2><p>زمینه را کوتاه توضیح بده و پرسش مشخصی بپرس.</p><label for="forumNewTitle">عنوان بحث</label><input id="forumNewTitle" required minlength="5" maxlength="140" placeholder="مثلاً: چطور تشخیص‌های افتراقی را اولویت‌بندی کنیم؟"><label for="forumNewCategory">دسته‌بندی</label><select id="forumNewCategory">${forumCategories.map(c=>'<option>'+c+'</option>').join('')}</select><label for="forumNewBody">متن بحث</label><textarea id="forumNewBody" required minlength="10" maxlength="6000" rows="6" placeholder="شرح موقعیت فرضی، استدلال شما و سؤالی که می‌خواهید بررسی کنیم…"></textarea><div class="actions"><button type="submit">انتشار بحث ←</button><button type="button" class="secondary" onclick="closeForumComposer()">بستن پیش‌نویس</button></div><p>پیش‌نویس در همین نشست مرورگر نگه داشته می‌شود؛ با انتشار برای دیگران قابل مشاهده است.</p></form></div><div class="forum-layout"><div class="forum-sidebar"><h2>گوشه‌های گفت‌وگو</h2><button class="selected" data-forum-category="" onclick="selectForumCategory('')">همهٔ بحث‌ها</button>${forumCategories.map((c,i)=>'<button data-forum-category="'+c+'" onclick="selectForumCategory(\''+c+'\')"><span aria-hidden="true">'+['◌','✚','◇','✿','▣','▤'][i]+'</span>'+c+'</button>').join('')}<div class="forum-side-note">به جای فقط پاسخ نهایی، مسیر فکرت را توضیح بده. احترام و حفظ حریم خصوصی، پایهٔ این فضاست.</div></div><div><div class="forum-tools"><input id="forumSearch" aria-label="جست‌وجو در بحث‌ها" placeholder="دنبال چه بحثی می‌گردی؟"><select id="forumFilter" aria-label="فیلتر بحث‌ها"><option value="all">همهٔ بحث‌ها</option><option value="unanswered">بدون پاسخ</option>${serverUser.role==='student'?'<option value="mine">بحث‌های من</option>':''}</select>${serverUser.role==='student'?'<button onclick="openForumComposer()">+ بحث تازه</button>':''}<button class="secondary" onclick="loadForumTopics()">تازه‌سازی</button></div><span class="forum-status" id="forumListStatus" role="status"></span><div id="forumTopicCards"></div><button class="secondary forum-more" id="forumMoreTopics" hidden onclick="loadForumTopics(true)">بحث‌های بیشتر</button></div></div></div><div id="forumThreadView" hidden></div>`;document.querySelector('footer').before(section);$('#forumSearch').oninput=()=>{clearTimeout(forumSearchTimer);forumSearchTimer=setTimeout(()=>loadForumTopics(),300)};$('#forumFilter').onchange=()=>loadForumTopics();$('#forumTopicForm').onsubmit=publishForumTopic;for(const id of ['forumNewTitle','forumNewCategory','forumNewBody'])$('#'+id).oninput=saveForumTopicDraft;const dialog=document.createElement('dialog');dialog.id='forumDeleteDialog';dialog.className='forum-danger-dialog';dialog.innerHTML='<h2>حذف از گفت‌وگو</h2><p id="forumDeleteText"></p><div class="actions"><button class="secondary" onclick="document.querySelector(\'#forumDeleteDialog\').close()">انصراف</button><button id="forumConfirmDelete">حذف</button></div>';document.body.append(dialog);$('#forumConfirmDelete').onclick=async()=>{const b=$('#forumConfirmDelete');b.disabled=true;try{await forumDeleteAction();dialog.close()}catch(e){notify(e.message)}finally{b.disabled=false}}}
function selectForumCategory(category){forumCategory=category;document.querySelectorAll('[data-forum-category]').forEach(b=>b.classList.toggle('selected',b.dataset.forumCategory===category));loadForumTopics()}
function saveForumTopicDraft(){sessionStorage.setItem(forumDraftKey('topic'),JSON.stringify({title:$('#forumNewTitle').value,category:$('#forumNewCategory').value,body:$('#forumNewBody').value}))}
function openForumComposer(){if(serverUser.role!=='student')return;let draft={};try{draft=JSON.parse(sessionStorage.getItem(forumDraftKey('topic'))||'{}')}catch{}$('#forumNewTitle').value=draft.title||'';$('#forumNewBody').value=draft.body||'';$('#forumNewCategory').value=forumCategories.includes(draft.category)?draft.category:forumCategory||forumCategories[0];$('#forumComposer').hidden=false;$('#forumNewTitle').focus();$('#forumComposer').scrollIntoView({behavior:'smooth',block:'start'})}
function closeForumComposer(){saveForumTopicDraft();$('#forumComposer').hidden=true}
async function publishForumTopic(e){e.preventDefault();const b=e.submitter;b.disabled=true;try{const result=await api('forum','POST',{title:$('#forumNewTitle').value,category:$('#forumNewCategory').value,body:$('#forumNewBody').value});sessionStorage.removeItem(forumDraftKey('topic'));$('#forumTopicForm').reset();$('#forumComposer').hidden=true;await openForumThread(result.id);notify('بحث منتشر شد')}catch(e){notify(e.message)}finally{b.disabled=false}}
async function loadForumTopics(more=false){if(!$('#forumTopicCards'))return;const epoch=++forumListEpoch;$('#forumListStatus').textContent='در حال دریافت گفت‌وگوها…';const params=new URLSearchParams({q:$('#forumSearch').value,category:forumCategory,filter:$('#forumFilter').value,offset:String(more?forumNext||0:0)});$('#forumMoreTopics').disabled=true;try{const data=await api('forum?'+params);if(epoch!==forumListEpoch)return;forumTopics=more?[...forumTopics,...data.topics]:data.topics;forumNext=data.nextOffset;renderForumTopics();$('#forumListStatus').textContent='گفت‌وگوها به‌روز شد'}catch(e){if(epoch===forumListEpoch){$('#forumListStatus').textContent='دریافت انجام نشد: '+e.message;notify(e.message)}}finally{if(epoch===forumListEpoch)$('#forumMoreTopics').disabled=false}}
function renderForumTopics(){$('#forumTopicCards').innerHTML=forumTopics.length?forumTopics.map(t=>`<article class="forum-topic-card"><div class="forum-topic-top"><span class="forum-chip">${escape(t.category)}</span>${t.pinned?'<span class="forum-chip pinned">سنجاق‌شده</span>':''}${t.locked?'<span class="forum-chip locked">بسته</span>':''}</div><button class="forum-title-button" onclick="openForumThread('${t.id}')">${escape(t.title)}</button><p class="forum-excerpt">${escape(t.excerpt)}${t.excerpt.length===180?'…':''}</p><div class="forum-topic-bottom">${forumAuthor(t.author_name)}<span>${Number(t.reply_count).toLocaleString('fa-IR')} پاسخ · آخرین فعالیت ${forumDate(t.updated)}</span></div></article>`).join(''):'<div class="forum-no-topics"><div class="forum-empty-icon" aria-hidden="true">☷</div><h2>هنوز گفت‌وگویی اینجا نیست.</h2><p>اگر جست‌وجو کرده‌اید، عبارت یا دسته‌بندی دیگری را امتحان کنید.</p>'+(serverUser.role==='student'?'<button onclick="openForumComposer()">اولین سؤال را تو بپرس ←</button>':'<p>بحث‌ها پس از انتشار توسط منتی‌ها اینجا نمایش داده می‌شوند.</p>')+'</div>';$('#forumMoreTopics').hidden=forumNext===null}
async function openForumThread(id,more=false){const epoch=++forumThreadEpoch;$('#forumListView').hidden=true;$('#forumThreadView').hidden=false;if(!more)$('#forumThreadView').innerHTML='<div class="forum-thread-toolbar"><button class="secondary" onclick="backToForum()">بازگشت به بحث‌ها ←</button></div><p class="forum-status" role="status">در حال دریافت بحث…</p>';try{const data=await api('forum/'+id+'?offset='+(more?forumPostNext||0:0));if(epoch!==forumThreadEpoch)return;forumCurrent=data.topic;forumPosts=more?[...forumPosts,...data.posts]:data.posts;forumPostNext=data.nextOffset;renderForumThread();if(!more)$('#forumThreadView').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){if(epoch===forumThreadEpoch){$('#forumThreadView').innerHTML='<button class="secondary" onclick="backToForum()">بازگشت به بحث‌ها ←</button><p class="forum-section-error" style="margin-top:15px">'+escape(e.message)+'</p>'}}}
function backToForum(){forumThreadEpoch++;forumCurrent=null;$('#forumThreadView').hidden=true;$('#forumListView').hidden=false;loadForumTopics()}
function forumPostMarkup(p){if(p.deleted)return '<article class="forum-post deleted">این پاسخ توسط نویسنده یا مدیر حذف شده است.</article>';const admin=serverUser.role==='admin';return `<article class="forum-post"><div class="forum-post-top">${forumAuthor(p.author_name)}<span>${forumDate(p.created)}</span></div><div class="forum-message-body">${escape(p.body)}</div><div class="forum-post-actions">${serverUser.role==='student'&&!p.isMine?'<button aria-pressed="'+Boolean(p.liked)+'" onclick="voteForumPost(\''+p.id+'\','+!p.liked+',this)">♡ مفید بود · '+Number(p.likes).toLocaleString('fa-IR')+'</button>':'<span class="forum-chip">'+Number(p.likes).toLocaleString('fa-IR')+' نفر مفید دانسته‌اند</span>'}${admin||p.isMine?'<button class="forum-delete" onclick="askDeleteForumPost(\''+p.id+'\')">حذف پاسخ</button>':''}</div></article>`}
function renderForumThread(){const t=forumCurrent,admin=serverUser.role==='admin';$('#forumThreadView').innerHTML=`<div class="forum-thread-toolbar"><button class="secondary" onclick="backToForum()">بازگشت به بحث‌ها ←</button><button class="secondary" onclick="openForumThread('${t.id}')">تازه‌سازی پاسخ‌ها</button><button id="forumNewPosts" hidden onclick="openForumThread('${t.id}')">تغییر تازه در بحث؛ نمایش ←</button></div><article class="forum-original"><div class="forum-topic-top"><span class="forum-chip">${escape(t.category)}</span>${t.pinned?'<span class="forum-chip pinned">سنجاق‌شده</span>':''}${t.locked?'<span class="forum-chip locked">بحث بسته است</span>':''}</div><h2>${escape(t.title)}</h2><div class="forum-topic-bottom">${forumAuthor(t.author_name)}<span>${forumDate(t.created)}</span></div><div class="forum-message-body">${escape(t.body)}</div>${admin||t.isMine?'<div class="forum-moderation">'+(admin?'<button onclick="moderateForum(\'lock\',this)">'+(t.locked?'بازکردن بحث':'بستن پاسخ‌ها')+'</button><button onclick="moderateForum(\'pin\',this)">'+(t.pinned?'برداشتن سنجاق':'سنجاق‌کردن بحث')+'</button>':'')+'<button class="forum-delete" onclick="askDeleteForumTopic()">حذف بحث</button></div>':''}</article><h3 class="forum-reply-heading">پاسخ‌های گفت‌وگو</h3><div id="forumPosts">${forumPosts.length?forumPosts.map(forumPostMarkup).join(''):'<p class="forum-empty">هنوز پاسخی ثبت نشده است.</p>'}</div>${forumPostNext!==null?'<button class="secondary forum-more" onclick="openForumThread(\''+t.id+'\',true)">پاسخ‌های بیشتر</button>':''}${serverUser.role==='student'?(t.locked?'<div class="forum-locked-note">این بحث توسط مدیر بسته شده است. پاسخ‌های قبلی قابل مطالعه‌اند.</div>':'<form id="forumReplyForm" class="forum-reply-form"><label for="forumReplyBody">تو چطور به این سؤال فکر می‌کنی؟</label><textarea id="forumReplyBody" required minlength="2" maxlength="6000" placeholder="پاسخ، دلیل و پرسش تکمیلی‌ات را بنویس…"></textarea><div class="forum-reply-footer"><span>نام شما همراه پاسخ نمایش داده می‌شود.</span><button type="submit">ارسال پاسخ ←</button></div></form>'):'<div class="forum-locked-note">شما در نمای ناظر هستید؛ می‌توانید بحث‌ها را مدیریت کنید.</div>'}`;if($('#forumReplyBody')){$('#forumReplyBody').value=sessionStorage.getItem(forumDraftKey('reply-'+t.id))||'';$('#forumReplyBody').oninput=()=>sessionStorage.setItem(forumDraftKey('reply-'+t.id),$('#forumReplyBody').value);$('#forumReplyForm').onsubmit=sendForumReply}}
async function sendForumReply(e){e.preventDefault();const id=forumCurrent.id,b=e.submitter;b.disabled=true;try{await api('forum/'+id+'/posts','POST',{body:$('#forumReplyBody').value});sessionStorage.removeItem(forumDraftKey('reply-'+id));await openForumThread(id);notify('پاسخ شما منتشر شد')}catch(e){notify(e.message)}finally{b.disabled=false}}
async function voteForumPost(id,liked,button){button.disabled=true;try{await api('forum/'+forumCurrent.id+'/posts/'+id+'/vote','PUT',{liked});const p=forumPosts.find(p=>p.id===id);if(p){p.likes=Number(p.likes)+(liked?1:-1);p.liked=Number(liked)}renderForumThread()}catch(e){notify(e.message);button.disabled=false}}
async function moderateForum(change,button){button.disabled=true;const t=forumCurrent;try{await api('forum/'+t.id,'PATCH',{version:t.version,locked:change==='lock'?!t.locked:Boolean(t.locked),pinned:change==='pin'?!t.pinned:Boolean(t.pinned)});await openForumThread(t.id);notify('وضعیت بحث تغییر کرد')}catch(e){notify(e.message);button.disabled=false}}
function askDeleteForumTopic(){const id=forumCurrent.id;$('#forumDeleteText').textContent='بحث و پاسخ‌های آن از دسترس اعضای فروم خارج می‌شوند. این کار را انجام می‌دهید؟';forumDeleteAction=async()=>{await api('forum/'+id,'DELETE',{});backToForum();notify('بحث از فروم حذف شد')};$('#forumDeleteDialog').showModal()}
function askDeleteForumPost(id){const topicId=forumCurrent.id;$('#forumDeleteText').textContent='متن این پاسخ از گفت‌وگو برداشته می‌شود و جای آن پیام حذف نمایش داده خواهد شد.';forumDeleteAction=async()=>{await api('forum/'+topicId+'/posts/'+id,'DELETE',{});await openForumThread(topicId);notify('پاسخ حذف شد')};$('#forumDeleteDialog').showModal()}
setInterval(async()=>{if(!forumCurrent||!$('#forum')?.classList.contains('active')||document.visibilityState!=='visible')return;const current=forumCurrent;try{const data=await api('forum/'+current.id);if(forumCurrent?.id===current.id&&(data.topic.updated!==current.updated||data.topic.version!==current.version))$('#forumNewPosts').hidden=false}catch{}},15000);
const forumNavigation=navigate;navigate=function(id){if(id==='forum'&&!['student','admin'].includes(serverUser?.role))id='overview';forumNavigation(id);if(id==='forum'&&!forumCurrent)loadForumTopics()};
</script>
