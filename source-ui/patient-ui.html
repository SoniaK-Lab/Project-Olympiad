<style>
.vp-hero{background:linear-gradient(120deg,#193f52,#315d70);border-radius:24px;padding:27px 30px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px;overflow:hidden;position:relative}.vp-hero h1{font-size:27px;line-height:1.7;margin:7px 0}.vp-hero p{font-size:12px;color:#c0d9e7;line-height:2;max-width:600px}.vp-kicker{font-size:10px;color:#ecc2d4;letter-spacing:1px}.vp-hero-seal{height:100px;width:100px;flex-shrink:0;border-radius:50%;border:1px solid #b3d3e444;display:grid;place-items:center;box-shadow:0 0 0 14px #b7d2e308,0 0 0 30px #b7d2e305;font-size:39px;color:#edc0d2}.vp-warning{font-size:11px;line-height:2;color:#817567;background:#fbefdf;border:1px solid #ebddc6;border-radius:12px;padding:13px 17px;margin-bottom:20px}.vp-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}.vp-monitor{background:#143747;color:#e3f0f6;border-radius:22px;padding:22px;overflow:hidden;position:relative}.vp-monitor:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 23px,#a8d1e306 24px),repeating-linear-gradient(90deg,transparent,transparent 23px,#a8d1e306 24px)}.vp-monitor>*{position:relative}.vp-monitor-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:#bed6e3}.vp-condition{padding:5px 10px;border:1px solid #efbfd450;background:#efbfd412;color:#edc0d2;border-radius:20px}.vp-condition.supported{color:#b3ded2;border-color:#b3ded250;background:#b3ded20e}.vp-body-row{display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:15px;margin-top:15px}.vp-person{max-height:220px;width:100%;color:#bcd5e7}.vp-lungs{transform-origin:100px 115px;animation:vp-breathe var(--vp-breath,2s) ease-in-out infinite}.vp-pulse{stroke-dasharray:270;animation:vp-trace 2.6s linear infinite;fill:none;stroke:#c9e7e0;stroke-width:2}.vp-body-label{font-size:10px;text-align:center;color:#b9d1df}.vp-patient-quote{border-right:2px solid #d7a6c0;padding-right:13px;font-size:12px;line-height:2;color:#e7c4d5}.vp-patient-info{font-size:11px;color:#afccdc;line-height:2;margin-top:15px}.vp-vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}.vp-vital{border:1px solid #b6d6e425;border-radius:12px;background:#ffffff05;padding:13px 10px;text-align:center}.vp-vital b{display:block;font-size:24px;color:#d8e9f8;font-variant-numeric:tabular-nums;font-weight:600;direction:ltr}.vp-vital small{font-size:9px;display:block;color:#b3cddc;margin-top:5px}.vp-vital.alert b{color:#e8b5cd}.vp-vital.good b{color:#b4dcd0}.vp-trend{margin-top:18px;border-top:1px solid #bfd9e424;padding-top:14px}.vp-trend-head{display:flex;justify-content:space-between;align-items:center;color:#b1cfdf;font-size:10px}.vp-trend svg{width:100%;height:105px;display:block}.vp-monitor-note{font-size:9px;color:#a5c4d4!important;line-height:1.9}.vp-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}.vp-toolbar button{font-size:11px;padding:10px 13px;background:#e4eff9;color:#31546c;border:1px solid #c9dcea}.vp-toolbar .vp-finish{background:#f6e6ed;color:#99627b;border-color:#e9cbd9}.vp-brief,.vp-controls,.vp-results{border:1px solid #e4e1de;border-radius:20px;padding:23px;background:#fffdf7}.vp-brief h2,.vp-controls h2,.vp-results h2{font-size:18px;color:#31556c;margin-bottom:12px}.vp-brief p{font-size:12px;line-height:2.1}.vp-brief ul{padding-right:20px;font-size:12px;line-height:2.3;color:#6e8293}.vp-brief>button{margin-top:20px;background:#2e5971}.vp-meta{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:17px}.vp-meta span{background:#ecf2fa;color:#63829a;border:1px solid #dbe6ef;border-radius:10px;padding:7px 12px;font-size:11px}.vp-group{margin-top:19px}.vp-group h3{font-size:11px;color:#8a7e8d;margin-bottom:8px}.vp-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vp-action{border:1px solid #dce5ed;border-radius:11px;background:#edf3fb;color:#42657c;font-size:11px;line-height:1.8;text-align:right;padding:12px;transition:transform .15s,box-shadow .15s}.vp-action:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 14px #21485d12}.vp-action small{display:block;font-size:9px;color:#8296a8;margin-top:5px}.vp-action:disabled{opacity:.55;cursor:default;background:#f5f2ed}.vp-action[data-action=discharge]{background:#f9e9ee;border-color:#ead1dd;color:#a16c84}.vp-feedback{border:1px solid #d8e3ee;border-right:3px solid #94b8d7;border-radius:12px;padding:15px;background:#eaf2fc;font-size:12px;line-height:2.1;color:#4b6b83;margin-top:18px;scroll-margin-top:20px}.vp-feedback.warn,.vp-feedback.danger{background:#faedf1;border-color:#e9cad8;color:#94637e}.vp-feedback.good{background:#eaf3ef;border-color:#caddd4;color:#577b71}.vp-records{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.vp-records>div{background:#fffdf7;border:1px solid #e3e1df;border-radius:19px;padding:22px}.vp-records h2{font-size:16px;color:#3d627a;margin-bottom:14px}.vp-findings details{border-bottom:1px solid #ebe5e2;padding:11px 0}.vp-findings summary{font-size:12px;color:#5e7d94;cursor:pointer}.vp-findings p{font-size:12px;line-height:2;padding-top:10px}.vp-event{position:relative;border-right:1px solid #d5e2ed;margin-right:6px;padding:0 17px 18px 0}.vp-event:before{content:'';position:absolute;right:-5px;top:6px;width:9px;height:9px;border:2px solid #fffdf7;background:#9dbbd4;border-radius:50%}.vp-event.warn:before,.vp-event.danger:before{background:#cc97af}.vp-event strong{display:block;font-size:11px;color:#54728a}.vp-event small{font-size:10px;color:#9a8995}.vp-event p{font-size:11px;line-height:2;margin-top:6px}.vp-empty{font-size:11px;line-height:2;color:#8a9aaa}.vp-results{margin-top:22px;background:linear-gradient(120deg,#edf4fb,#fff7f3)}.vp-result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.vp-result-grid>div{padding:18px;background:#fffcf8;border:1px solid #e2e5eb;border-radius:13px}.vp-result-grid b{font-size:22px;color:#4b718b;display:block}.vp-result-grid span{font-size:10px;color:#8697a5}.vp-results p,.vp-results li{font-size:12px;line-height:2}.vp-results ul{padding-right:20px;color:#7d6a7a}.vp-reference{font-size:10px;color:#8795a2;line-height:2;margin-top:18px}.vp-reference a{text-decoration:underline}.vp-entry{margin-top:17px;background:#254d65;color:white;font-size:12px;padding:12px 17px}.vp-saved{font-size:10px;color:#859aab;margin-top:15px}.vp-limit{font-size:10px;color:#8c7b69;margin-top:7px}@keyframes vp-breathe{50%{transform:scale(1.035)}}@keyframes vp-trace{from{stroke-dashoffset:540}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.vp-lungs,.vp-pulse{animation:none}.vp-action{transition:none}}@media(max-width:1050px){.vp-layout{grid-template-columns:1fr}.vp-records{grid-template-columns:1fr}.vp-body-row{grid-template-columns:160px 1fr}.vp-person{max-height:180px}}@media(max-width:600px){.vp-hero{padding:22px}.vp-hero h1{font-size:22px}.vp-hero-seal{display:none}.vp-monitor{padding:16px}.vp-vital b{font-size:20px}.vp-body-row{grid-template-columns:105px 1fr}.vp-patient-quote{font-size:11px}.vp-controls,.vp-brief{padding:18px}.vp-action-grid{grid-template-columns:1fr}.vp-result-grid{grid-template-columns:1fr}.vp-records>div{padding:17px}}
</style>
<script>
let vpModel=null;
function vpCurrent(){if(vpModel)return vpModel;const stored=extras.virtualPatient;let s=VirtualPatientEngine.initial();if(stored?.version===1&&stored.started){s.started=true;for(const id of (Array.isArray(stored.actions)?stored.actions:[]).slice(0,60))s=VirtualPatientEngine.act(s,id);if(stored.manualEnd&&!s.ended){s.ended=true;s.reason='پایان تمرین به انتخاب شما';s.manualEnd=true}}return vpModel=s}
function vpPersist(){const s=vpCurrent();extras.virtualPatient={version:1,started:s.started,actions:s.events.map(e=>e.id),manualEnd:!!s.manualEnd};queueProgress()}
function setupVirtualPatient(){if(serverUser.role!=='student')return;const nav=document.createElement('button');nav.dataset.view='virtual-patient';nav.innerHTML='<span>♡</span>بیمار مجازی';nav.onclick=()=>navigate('virtual-patient');const anchor=document.querySelector('nav button[data-view="cases"]');if(anchor)anchor.after(nav);else document.querySelector('nav').append(nav);const section=document.createElement('section');section.id='virtual-patient';section.className='view';section.innerHTML=`<div class="vp-hero"><div><span class="vp-kicker">آزمایشگاه تصمیم‌گیری بالینی · سناریوی ۰۱</span><h1>بیمار به تصمیم تو واکنش نشان می‌دهد.</h1><p>شواهد را پیدا کن، اولویت‌ها را بسنج و اثر انتخاب‌هایت را روی مسیر بیمار ببین.</p></div><div class="vp-hero-seal" aria-hidden="true">♡</div></div><div class="vp-warning">بیمار، نتایج، هزینه‌ها و تغییر علائم کاملاً فرضی‌اند. این یک شبیه‌ساز تصمیم‌گیری است؛ مدل پیش‌بینی وضعیت بیمار، نسخهٔ درمانی یا سنجش رسمی صلاحیت نیست. اطلاعات بیمار واقعی وارد نکنید.</div><div id="vpContent"></div><p class="vp-reference">چارچوب آموزشی با مراجعه به <a href="https://www.nice.org.uk/guidance/ng250/chapter/Recommendations" target="_blank" rel="noopener noreferrer">NICE NG250: پنومونی</a> و <a href="https://www.nice.org.uk/guidance/cg50/chapter/Recommendations" target="_blank" rel="noopener noreferrer">NICE CG50: شناسایی بدحالی</a> نوشته شده؛ مقادیر و شاخه‌های شبیه‌سازی، طراحی آموزشی این سایت‌اند.</p>`;document.querySelector('footer').before(section);const button=document.createElement('button');button.className='vp-entry';button.textContent='ورود به شبیه‌ساز بیمار واکنش‌پذیر ←';button.onclick=()=>navigate('virtual-patient');$('#cases .greeting').after(button);renderVirtualPatient()}
function vpStart(){if(serverUser.role!=='student')return;vpCurrent().started=true;vpPersist();renderVirtualPatient()}
function vpAction(id){if(serverUser.role!=='student')return;vpModel=VirtualPatientEngine.act(vpCurrent(),id);vpPersist();renderVirtualPatient();$('#vpFeedback')?.focus({preventScroll:true})}
function vpReset(){if(serverUser.role!=='student')return;vpModel=VirtualPatientEngine.initial();vpPersist();renderVirtualPatient()}
function vpEnd(){const s=vpCurrent();if(!s.started||s.ended)return;s.ended=true;s.manualEnd=true;s.reason='پایان تمرین به انتخاب شما';vpPersist();renderVirtualPatient();$('#vpResults')?.scrollIntoView({behavior:'smooth',block:'start'})}
function vpNumber(n){return n.toLocaleString('fa-IR')}
function vpTrend(s){const points=s.history.map(p=>(35+p.minute/40*390)+','+(90-(p.spo2-80)/20*75)).join(' ');return `<div class="vp-trend"><div class="vp-trend-head"><span>روند اشباع اکسیژن · درصد</span><span>زمان سناریو · دقیقه</span></div><svg viewBox="0 0 460 115" role="img" aria-label="روند اشباع اکسیژن: ${s.history.map(p=>p.minute+' دقیقه، '+p.spo2+' درصد').join('؛ ')}"><g stroke="#b5d4e422" stroke-width="1"><path d="M35 15H425M35 52.5H425M35 90H425"/></g><g fill="#abcbdc" font-size="9"><text x="2" y="18">100</text><text x="7" y="56">90</text><text x="7" y="94">80</text><text x="35" y="109">0</text><text x="181" y="109">15</text><text x="327" y="109">30</text><text x="425" y="109">40</text></g><polyline points="${points}" fill="none" stroke="#efbcd3" stroke-width="2.5"/>${s.history.map(p=>`<circle cx="${35+p.minute/40*390}" cy="${90-(p.spo2-80)/20*75}" r="3" fill="#eec4d8"><title>${vpNumber(p.minute)} دقیقه: ${vpNumber(p.spo2)}٪</title></circle>`).join('')}</svg></div>`}
function vpMonitor(s){const v=s.vitals,supported=s.used.includes('oxygen');const vital=(label,value,unit,style='')=>'<div class="vp-vital '+style+'"><b>'+value+'</b><small>'+label+' · '+unit+'</small></div>';return `<div class="vp-monitor"><div class="vp-monitor-top"><span>بیمار فرضی ۰۰۱ · مرد ۵۶ساله</span><span class="vp-condition ${supported?'supported':''}">${supported?'تحت حمایت اکسیژنی':'افت اکسیژن'}</span></div><div class="vp-body-row"><div><svg class="vp-person" viewBox="0 0 200 240" aria-hidden="true"><defs><linearGradient id="vpBodyFill" x2="1" y2="1"><stop stop-color="#b8d5e7" stop-opacity=".2"/><stop offset="1" stop-color="#8db5cf" stop-opacity=".06"/></linearGradient></defs><circle cx="100" cy="35" r="22" fill="url(#vpBodyFill)" stroke="#aacde166"/><path d="M80 59L60 72Q47 78 43 108L32 171Q30 182 39 184Q49 185 51 174L62 121L66 193L60 231M120 59L140 72Q153 78 157 108L168 171Q170 182 161 184Q151 185 149 174L138 121L134 193L140 231M66 193H134M88 193L87 231M112 193L113 231" fill="url(#vpBodyFill)" stroke="#aacde166" stroke-width="2"/><g class="vp-lungs" style="--vp-breath:${60/v.rr}s"><path d="M94 93Q87 75 74 91Q61 111 72 138Q87 148 94 129Z" fill="#c7e2ef" opacity=".65"/><path d="M106 93Q113 75 126 91Q139 111 128 138Q113 148 106 129Z" fill="#e1b3cc" opacity=".8"/><path d="M100 73V105M100 93L88 110M100 93L112 110" stroke="#e6edf4" fill="none" stroke-width="3"/></g><path class="vp-pulse" d="M47 161H73L81 151L89 177L99 141L109 169L118 161H154"/></svg><div class="vp-body-label">حرکت تنفس و موج قلب، تصویرسازی‌اند</div></div><div><blockquote class="vp-patient-quote">${s.ended?'«حالا تصمیم‌ها و گام بعدی را با تیم مرور کنیم.»':supported?'«نفسم کمی راحت‌تر شده، ولی هنوز حالم خوب نیست…»':'«چند روزه تب دارم… امروز نفس کشیدن سخت‌تر شده.»'}</blockquote><p class="vp-patient-info">محل: ارزیابی اولیهٔ بیمارستان<br>شکایت اصلی: تب، سرفه و تنگی نفس<br>زمان فقط با اقدام‌های شما جلو می‌رود.</p></div></div><div class="vp-vitals">${vital('اشباع اکسیژن',vpNumber(v.spo2),'٪',v.spo2<92?'alert':'good')}${vital('ضربان قلب',vpNumber(v.hr),'در دقیقه')}${vital('تعداد تنفس',vpNumber(v.rr),'در دقیقه')}${vital('فشار خون',vpNumber(v.sbp)+'/'+vpNumber(v.dbp),'mmHg')}${vital('دما',vpNumber(v.temp),'°C')}${vital('زمان سپری‌شده',vpNumber(s.minute),'دقیقه')}</div>${vpTrend(s)}<p class="vp-monitor-note">اثر اکسیژن و افت علائم در این نمایش از پیش طراحی شده‌اند؛ پاسخ واقعی بیمار یا سرعت اثر درمان را پیش‌بینی نمی‌کنند.</p></div>`}
function vpReport(s){const r=VirtualPatientEngine.report(s);return `<section class="vp-results" id="vpResults"><span class="tag">بازنگری تصمیم‌ها</span><h2 style="margin-top:12px">${escape(s.reason)}</h2><p>این گزارش ترتیب تصمیم‌ها و موارد مرورشده را نشان می‌دهد؛ نمرهٔ صلاحیت بالینی نیست.</p><div class="vp-result-grid"><div><b>${vpNumber(r.completed)} از ${vpNumber(r.total)}</b><span>محور آموزشی مرورشده</span></div><div><b>${vpNumber(s.minute)} دقیقه</b><span>زمان فرضی مصرف‌شده</span></div><div><b>${vpNumber(s.cost)} امتیاز</b><span>هزینهٔ فرضی بررسی‌ها، بدون واحد پول</span></div></div><p>${r.earlySupport?'✓ حمایت اکسیژنی در پنج دقیقهٔ اولِ مسیر فرضی شروع شد.':'در شروع حمایت اکسیژنی تأخیر رخ داد یا حمایت آغاز نشد؛ اولویت رسیدگی را مرور کنید.'}</p>${r.unnecessaryCT?'<p>سی‌تی در این شاخه، اطلاعات تصمیم‌ساز اضافه نداشت؛ ارزش بررسی را در برابر تأخیر و هزینه بسنجید.</p>':''}${r.unsafeDischarge?'<p>ترخیص در حضور ناپایداری، تصمیم نیازمند بازنگری این تمرین بود.</p>':''}<h3 style="font-size:13px;margin-top:17px">${r.missing.length?'برای گفت‌وگو با منتور':'برای ادامهٔ بحث'}</h3>${r.missing.length?'<ul>'+r.missing.map(x=>'<li>'+escape(x)+'</li>').join('')+'</ul>':'<p>اگر با وجود اقدامات اولیه اشباع اکسیژن بهتر نمی‌شد، چه علل دیگری و چه سطح حمایتی را با ارشد بررسی می‌کردید؟</p>'}<p style="margin-top:14px">گام بعدی بیمار در مسیر مناسب، ادامهٔ مراقبت و بازبینی تیم است؛ این تمرین به معنی رفع عفونت یا مجوز ترخیص نیست.</p><div class="vp-toolbar"><button onclick="vpReset()">شروع دوباره از ابتدا ↻</button><button onclick="navigate('sessions')">بازگشت به جلسات من ←</button></div></section>`}
function renderVirtualPatient(){if(!$('#vpContent')||serverUser?.role!=='student')return;const s=vpCurrent();const brief=`<div class="vp-brief"><span class="tag">آماده‌ای تصمیم بگیری؟</span><h2 style="margin-top:15px">بیماری که نفس کم می‌آورد</h2><p>مردی ۵۶ساله با تب، سرفه و تنگی نفس وارد محل ارزیابی شده است. نقش شما انتخاب اولویت‌های رسیدگی اولیه زیر نظر تیم است.</p><ul><li>زمان با هر اقدام، به‌صورت فرضی جلو می‌رود.</li><li>بررسی‌ها نتیجه، هزینهٔ امتیازی و زمان متفاوت دارند.</li><li>بدون حمایت، مسیر فرضی می‌تواند بدتر شود.</li><li>تصمیم‌های شما ذخیره می‌شوند؛ می‌توانید بعداً ادامه دهید.</li></ul><button onclick="vpStart()">شروع ارزیابی بیمار ←</button><p class="vp-limit">هیچ صدا، دوربین یا اطلاعات بیمار واقعی استفاده نمی‌شود.</p></div>`;let controls='';if(s.started&&!s.ended){controls='<div class="vp-controls"><h2>اقدام بعدی شما چیست؟</h2><div class="vp-meta"><span>'+vpNumber(s.minute)+' دقیقه از سناریو</span><span>هزینه: '+vpNumber(s.cost)+' امتیاز فرضی</span></div>';for(const group of ['ارزیابی','اقدام','بررسی','تصمیم'])controls+='<div class="vp-group"><h3>'+group+'</h3><div class="vp-action-grid">'+Object.entries(VirtualPatientEngine.catalog).filter(([id,a])=>a.group===group).map(([id,a])=>'<button class="vp-action" data-action="'+id+'" onclick="vpAction(\''+id+'\')" '+(s.used.includes(id)&&!['wait','reassess'].includes(id)?'disabled':'')+'>'+escape(a.label)+(s.used.includes(id)?' ✓':'')+'<small>'+vpNumber(a.minutes)+' دقیقهٔ فرضی'+(a.cost?' · '+vpNumber(a.cost)+' امتیاز هزینه':'')+'</small></button>').join('')+'</div></div>';controls+='<div id="vpFeedback" class="vp-feedback '+s.level+'" tabindex="-1" role="status">'+escape(s.last)+'</div><div class="vp-toolbar"><button class="vp-finish" onclick="vpEnd()">پایان تمرین و دیدن گزارش</button></div><p class="vp-saved">ذخیره در حساب شما؛ وضعیت ذخیره را بالای صفحه ببینید.</p></div>'}else if(s.ended){controls='<div class="vp-brief"><span class="tag">تمرین تمام شد</span><h2 style="margin-top:15px">حالا مسیرت را مرور کن.</h2><p>'+escape(s.last)+'</p><p>گزارش پایین صفحه، گام‌های انجام‌شده و نکات گفت‌وگو با منتور را نشان می‌دهد.</p></div>'}else controls=brief;$('#vpContent').innerHTML='<div class="vp-layout">'+vpMonitor(s)+controls+'</div>'+(s.started?'<div class="vp-records"><div class="vp-findings"><h2>پروندهٔ کشف‌شده</h2>'+(s.findings.length?s.findings.map(f=>'<details open><summary>'+escape(f.label)+'</summary><p>'+escape(f.text)+'</p></details>').join(''):'<p class="vp-empty">با شرح‌حال، معاینه و بررسی‌ها، اطلاعات پرونده اینجا باز می‌شود.</p>')+'</div><div><h2>خط زمانی تصمیم‌ها</h2>'+(s.events.length?s.events.map(e=>'<div class="vp-event '+e.level+'"><strong>'+escape(e.label)+'</strong><small>دقیقهٔ '+vpNumber(e.minute)+'</small><p>'+escape(e.text)+'</p></div>').reverse().join(''):'<p class="vp-empty">هنوز اقدامی انتخاب نشده است.</p>')+'</div></div>':'')+(s.ended?vpReport(s):'')}
const virtualPatientNavigation=navigate;navigate=function(id){if(id==='virtual-patient'&&serverUser?.role!=='student')id='overview';virtualPatientNavigation(id);if(id==='virtual-patient')renderVirtualPatient()};
</script>
